<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasaporte al pasado · Muestras SPAN 3000</title><style>
:root{--bg:#eee9e0;--panel:#fff;--ink:#172d35;--muted:#50636b;--accent:#075f62;--line:#b7c9c7;--warm:#fae1bd;--purple:#633c83}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Avenir Next","Trebuchet MS",sans-serif}body.dark{--bg:#11252e;--panel:#1d3540;--ink:#f2f6f4;--muted:#c0d5d8;--accent:#83d9ca;--line:#55737d;--warm:#3f3c32;--purple:#d9b2f5}button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,select:focus-visible{outline:3px solid #c68131;outline-offset:3px}.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:bold}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}header strong{font:700 23px Georgia,serif}header small{display:block;color:var(--muted);font-size:12px;letter-spacing:2px}.tools{display:flex;gap:7px;flex-wrap:wrap}main{max-width:1400px;margin:22px auto;padding:0 3vw}.layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:22px}.slide{background:var(--panel);border-radius:20px;padding:clamp(24px,3.5vw,50px);border-top:8px solid var(--accent);position:relative;overflow:hidden;min-height:62vh;box-shadow:0 10px 35px #16343b10}.slide:after{content:"";position:absolute;right:-70px;top:-80px;width:240px;height:240px;border:28px solid #bd8d4a16;border-radius:50%;pointer-events:none}.eyebrow{font:700 13px "Courier New",monospace;letter-spacing:2px;color:var(--purple)}h1{font:700 clamp(34px,4vw,58px)/1.08 Georgia,serif;letter-spacing:-1px;margin:14px 0 18px}#task{font-size:21px;color:var(--muted);max-width:850px}#prompt{font-size:clamp(25px,2.65vw,38px);line-height:1.45;white-space:pre-line;border-left:5px solid #ce8949;padding-left:23px;margin:28px 0}#options{display:flex;gap:12px;flex-wrap:wrap}#options span{background:var(--bg);padding:10px 20px;border-radius:9px;font-size:23px}.reveal{padding:18px 22px;border-radius:12px;margin-top:18px;background:var(--warm);font-size:21px;white-space:pre-line}#answer strong{color:var(--accent)}#why{font-size:18px;margin:10px 0 0}aside{display:flex;flex-direction:column;gap:14px}.clock{background:var(--ink);color:var(--panel);text-align:center;border-radius:18px;padding:22px 12px}.clock small{font:13px monospace;letter-spacing:2px}.clock output{display:block;font:bold 66px/1.3 "Courier New",monospace}.clock.expired{background:#a83d36;color:white}.timerbuttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.timerbuttons button{margin:0}.timerbuttons .primary{grid-column:1/-1}.guide{font-size:14px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:18px 0}.reveals{display:flex;flex-wrap:wrap;gap:8px}#notes{font-size:17px;background:var(--panel);border:1px dashed var(--purple)}#status{min-height:1.5em;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}.guide{grid-column:1/-1}.slide{min-height:0}#prompt{font-size:25px}}@media print{header,.controls,aside,footer{display:none}.layout{display:block}.slide{box-shadow:none}}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:10px}.icon svg{flex:none}</style></head><body><header><div><small>DR. RAMA · SPAN 3000 · EXAMEN 2 · MUESTRAS POR ÁREA</small><strong>Pasaporte al pasado</strong></div><div class="tools"><button class="icon" id="theme" title="Modo oscuro" aria-label="Modo oscuro" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button><button class="icon" id="full" title="Pantalla completa" aria-label="Pantalla completa" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button class="icon" id="sound" title="Silenciar sonido" aria-label="Silenciar sonido" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button></div></header><main id="deck"><div class="layout"><article class="slide"><div class="eyebrow" id="tag"></div><h1 id="title"></h1><p id="task"></p><div id="prompt"></div><div id="options"></div><div id="hint" class="reveal" hidden></div><div id="answer" class="reveal" hidden><strong id="solution"></strong><p id="why"></p></div><div id="gloss" class="reveal" hidden></div></article><aside><div class="clock" id="clock"><small>TIEMPO DE RONDA</small><output id="time" aria-label="Tiempo restante">0:30</output><div id="timerState">Listo</div></div><div class="timerbuttons"><button id="start" class="primary">Iniciar</button><button id="add">+15 s</button><button id="reset">Reiniciar 30 s</button></div><div class="guide">Tú marcas el ritmo.<br>Al cambiar de diapositiva, el reloj vuelve a 30 s y queda en pausa.<br><br>← → Navegar<br>Espacio: iniciar / pausar<br>R: respuesta<br>+ : añadir 15 s</div></aside></div><footer><div class="controls tools"><button id="prev">← Anterior</button><select id="jump" aria-label="Seleccionar actividad"></select><button id="next">Siguiente →</button><button id="random">Aleatoria</button></div><span id="count"></span></footer><div class="reveals"><button data-target="hint">Pista</button><button data-target="answer">Respuesta / modelo</button><button data-target="gloss">Glosa / contexto</button><button data-target="notes">Notas del profesor</button></div><div id="notes" class="reveal" hidden></div><p id="status" aria-live="polite"></p></main><script>
const slides=[{"type":"Pretérito irregular","title":"Un viaje con imprevistos","task":"Conjuga los verbos en pretérito y explica una forma.","prompt":"Ayer yo ___ (tener) que cambiar de hotel. La recepcionista me ___ (dar) otra dirección y mi amiga se ___ (sentir) más tranquila.","answer":"Tuve · dio · sintió","why":"Tuve tiene raíz irregular; dio no lleva tilde; sentir cambia e → i en la tercera persona del pretérito.","hint":"Tres sujetos: yo, la recepcionista, mi amiga.","gloss":"Frase útil: «Tengo una reserva a nombre de…».","notes":"Matches the exported preterite section. Follow up orally with ir, poner, querer, caer, decir, dormir, empezar, estar, saber and llegar. This is one sample, not the full verb inventory.","tag":"01 · PRETÉRITO IRREGULAR"},{"type":"Pretérito e imperfecto","title":"El barrio y la sorpresa","task":"Elige una forma en cada espacio y explica el contraste.","prompt":"El barrio ___ (era / fue) tranquilo. Mientras nosotros ___ (caminábamos / caminamos), de repente ___ (oíamos / oímos) música desde una plaza.","answer":"Era · caminábamos · oímos","why":"Era describe el lugar; caminábamos presenta el fondo en desarrollo; oímos introduce el nuevo evento.","hint":"Descripción → acción en desarrollo → evento.","gloss":"«¡Qué padre!» = How cool! Informal, frecuente en México.","notes":"Ask for the narrative perspective, not a mechanical time-word rule. Students should explain how the scene changes.","tag":"02 · PRETÉRITO E IMPERFECTO"},{"type":"Pluscuamperfecto","title":"La puerta ya estaba cerrada","task":"Completa las dos formas. ¿Qué ocurrió antes?","prompt":"Al llegar al museo, nosotros ___ (estar) decepcionados porque la guía ya ___ (salir) con el grupo.","answer":"Estábamos · había salido","why":"Estábamos describe el estado al llegar. Había salido sitúa la salida antes de nuestra llegada.","hint":"Estado pasado + haber en imperfecto y participio.","gloss":"«Estamos fritos» = We are in trouble. Coloquial en varios países.","notes":"Direct parallel to the exported two-blank imperfect/pluperfect item. Draw the departure before the arrival on the board.","tag":"03 · PLUSCUAMPERFECTO"},{"type":"Narración integrada","title":"Una visita muy chida","task":"Elige las formas que construyen esta historia.","prompt":"El sábado ___ (fuimos / íbamos) a un museo. El edificio ___ (era / fue) pequeño. Allí vimos una foto de la familia que ___ (había vivido / ha vivido) en la casa antes de su conversión en museo.","answer":"Fuimos · era · había vivido","why":"Evento completo, descripción de fondo y hecho anterior a otro momento pasado.","hint":"Piensa en la función de cada frase dentro del relato.","gloss":"chido, -a = cool / great. Informal, frecuente en México.","notes":"Represents the longer dropdown narrative in the export. Ask students to retell the sequence after choosing.","tag":"04 · NARRACIÓN INTEGRADA"},{"type":"Traducción: quedarse sin","title":"Se acabó el café","task":"Traduce al español. Propón dos maneras si puedes.","prompt":"“They ran out of coffee.”","answer":"Se quedaron sin café. / Se les acabó el café.","why":"Quedarse sin expresa la falta resultante; se les acabó presenta el agotamiento del café.","hint":"Quedarse sin… / Se les…","gloss":"«¿Qué plato típico me recomienda?» es una pregunta útil en un restaurante.","notes":"Parallel to the bread translation in the export. Accept natural alternatives that preserve the meaning.","tag":"05 · TRADUCCIÓN: QUEDARSE SIN"},{"type":"Traducción: acabar de","title":"Justo ahora","task":"Traduce usando acabar de.","prompt":"“She just got up.”","answer":"Acaba de levantarse. / Se acaba de levantar.","why":"Acabar en presente + de + infinitivo expresa una acción recién terminada. El pronombre puede ir antes de acaba o unido al infinitivo.","hint":"Acaba de…","gloss":"«Vale» = OK / all right. Frecuente en España.","notes":"Parallel to the just-got-up translation. Other recent-past translations may also be natural, but this prompt explicitly targets acabar de.","tag":"06 · TRADUCCIÓN: ACABAR DE"},{"type":"Traducción: duración","title":"Seguimos esperando","task":"Traduce. La espera continúa ahora.","prompt":"“We have been here for two hours.”","answer":"Llevamos dos horas aquí. / Hace dos horas que estamos aquí. / Estamos aquí desde hace dos horas.","why":"Las tres opciones conectan el comienzo de la estancia con el presente.","hint":"Llevamos… / Hace… que… / Desde hace…","gloss":"«¿Este autobús va al centro?» = Does this bus go downtown?","notes":"Parallel to the one-hour translation. Discuss how English present perfect often maps to Spanish present in ongoing-duration expressions.","tag":"07 · TRADUCCIÓN: DURACIÓN"},{"type":"Presente perfecto","title":"¿Ya está listo?","task":"Traduce manteniendo la pregunta por el resultado hasta ahora.","prompt":"“Have you opened the suitcase?”","answer":"¿Has abierto la maleta? / ¿Ha abierto usted la maleta?","why":"Haber en presente + abierto, participio irregular de abrir. El participio no concuerda con maleta.","hint":"Has + participio…","gloss":"maleta = suitcase.","notes":"Parallel to the composition translation. A preterite question is natural in many varieties; explain that this sample specifically rehearses the present perfect in the export.","tag":"08 · PRESENTE PERFECTO"},{"type":"Querer y poder","title":"Un plan que no salió","task":"Traduce y explica por qué elegiste esos tiempos.","prompt":"“I wanted to visit the museum yesterday, but I couldn’t.”","answer":"Quería visitar el museo ayer, pero no pude.","why":"Quería presenta el deseo como fondo. No pude resume la imposibilidad en esa ocasión. Quise puede ser válido si se presenta el deseo o intento como evento delimitado.","hint":"Deseo de fondo + resultado de una ocasión.","gloss":"«No quería gastar tanta pasta» = I did not want to spend so much money. Pasta: coloquial en España.","notes":"Parallel to the wanted-to-travel translation. Accept meaning-based alternatives; do not teach that querer always requires imperfect.","tag":"09 · QUERER Y PODER"},{"type":"Composición: plan oral","title":"Una nueva vida","task":"Prepara un esquema oral. Cada persona añade una etapa.","prompt":"Una persona latinoamericana se muda a Estados Unidos porque no encuentra trabajo.\n1 · ¿Cómo era su vida antes?\n2 · ¿Por qué decidió irse y cómo realizó el viaje?\n3 · ¿Qué problemas ha enfrentado?\n4 · ¿Cómo será su futuro?","answer":"Antes vivía en una ciudad pequeña. Un día decidió buscar trabajo en otro país. Ya había hablado con un familiar antes de viajar. Desde entonces ha afrontado varios retos. En el futuro continuará sus estudios.","why":"Modelo breve para planear, no una composición completa. Conecta situaciones de fondo, acontecimientos y experiencias.","hint":"Antes… / Decidió… / Ya había… / Desde entonces ha… / En el futuro…","gloss":"Puedes inventar la historia. No hace falta compartir experiencias personales.","notes":"Matches the exported 250–300-word migration narrative, including origin, decision, journey, challenges and future. Start with 30 seconds of planning and add 15 seconds per contribution. Do not score this short model as a full essay.","tag":"10 · COMPOSICIÓN: PLAN ORAL"},{"type":"Vocabulario de presentaciones","title":"¿Con quién lo dirías?","task":"Explica el significado y elige un contexto adecuado para cada frase.","prompt":"1 · «El recorrido estuvo chido».\n2 · «No quiero gastar tanta pasta».\n3 · Llegas al hotel: ¿qué dices para identificar tu reserva?","answer":"1 · El recorrido estuvo muy bien. Uso informal frecuente en México.\n2 · No quiero gastar tanto dinero. Uso coloquial en España.\n3 · Disculpe, tengo una reserva a nombre de…","why":"El significado, la región y el registro ayudan a escoger expresiones adecuadas. Las etiquetas regionales no son fronteras exclusivas.","hint":"Piensa en México, España y una interacción cortés en recepción.","gloss":"chido = cool / great; pasta = money; reserva a nombre de = reservation under the name…","notes":"PROPOSED NEW TEST COVERAGE. These samples come from the travel/slang handout already reviewed. The final vocabulary list and other presentation themes are not yet confirmed. Assess meaning and appropriate use, not stereotypes or exclusive country matching.","tag":"11 · VOCABULARIO DE PRESENTACIONES"}];
let index=0,remaining=30000,deadline=0,running=false,muted=false,audio;
const $=id=>document.getElementById(id);
const icons={"moon":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z\"/></svg>","sun":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5\"/></svg>","expand":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5\"/></svg>","collapse":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5\"/></svg>","volume":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 5-6 4H2v6h3l6 4V5Z\"/><path d=\"M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14\"/></svg>","mute":"<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 5-6 4H2v6h3l6 4V5Z\"/><path d=\"m16 9 6 6m0-6-6 6\"/></svg>"};
function iconButton(id,icon,label,pressed){const b=$(id);b.innerHTML=icons[icon];b.title=label;b.setAttribute("aria-label",label);b.setAttribute("aria-pressed",String(pressed))}

slides.forEach((s,i)=>$('jump').add(new Option((i+1)+' · '+s.type,i)));
function stop(){if(running)remaining=Math.max(0,deadline-performance.now());running=false;$('start').textContent=remaining>0?'Iniciar / continuar':'Volver a iniciar';}
function display(){const s=Math.ceil(remaining/1000);$('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('clock').classList.toggle('expired',remaining<=0);$('timerState').textContent=remaining<=0?'¡Tiempo!':running?'En marcha':'En pausa';}
function reset(){stop();remaining=30000;$('start').textContent='Iniciar';display()}
function render(){reset();const s=slides[index];['tag','title','task','prompt','hint','gloss','notes'].forEach(k=>$(k).textContent=s[k]);$('solution').textContent=s.answer;$('why').textContent=s.why;$('options').replaceChildren();(s.options||[]).forEach(v=>{const e=document.createElement('span');e.textContent=v;$('options').append(e)});['hint','answer','gloss','notes'].forEach(k=>$(k).hidden=true);document.querySelectorAll('[data-target]').forEach(b=>b.setAttribute('aria-expanded','false'));$('count').textContent=(index+1)+' / '+slides.length;$('jump').value=index;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;$('status').textContent='';}
function unlockAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function chime(){if(muted||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=740;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.55);o.start();o.stop(audio.currentTime+.55)}catch{}}
function toggle(){unlockAudio();if(running){stop()}else{if(remaining<=0)remaining=30000;deadline=performance.now()+remaining;running=true;$('start').textContent='Pausar'}display()}
setInterval(()=>{if(!running)return;remaining=Math.max(0,deadline-performance.now());if(remaining===0){stop();remaining=0;chime();$('status').textContent='Tiempo terminado. Puedes añadir 15 segundos o pasar a la siguiente actividad.'}display()},100);
$('start').onclick=toggle;$('reset').onclick=reset;$('add').onclick=()=>{if(running){remaining=Math.max(0,deadline-performance.now())+15000;deadline=performance.now()+remaining}else remaining+=15000;display()};
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<slides.length-1){index++;render()}};$('jump').onchange=e=>{index=Number(e.target.value);render()};$('random').onclick=()=>{index=(index+1+Math.floor(Math.random()*(slides.length-1)))%slides.length;render()};
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{const e=$(b.dataset.target);e.hidden=!e.hidden;b.setAttribute('aria-expanded',String(!e.hidden))});
$('theme').onclick=()=>{const dark=document.body.classList.toggle('dark');iconButton('theme',dark?'sun':'moon',dark?'Modo claro':'Modo oscuro',dark)};
$('sound').onclick=()=>{muted=!muted;if(!muted)unlockAudio();iconButton('sound',muted?'mute':'volume',muted?'Activar sonido':'Silenciar sonido',muted)};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='La pantalla completa no está disponible en esta vista. Abre el archivo en una pestaña del navegador.'}};
document.addEventListener('fullscreenchange',()=>{const full=!!document.fullscreenElement;iconButton('full',full?'collapse':'expand',full?'Salir de pantalla completa':'Pantalla completa',full)});
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){$('next').click();e.preventDefault()}if(e.key==='ArrowLeft'){$('prev').click();e.preventDefault()}if(e.code==='Space'){toggle();e.preventDefault()}if(e.key.toLowerCase()==='r')document.querySelector('[data-target="answer"]').click();if(e.key==='+')$('add').click()});
render();
</script></body></html>
