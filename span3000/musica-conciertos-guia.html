<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Música y conciertos · Dr. Rama</title><style>
:root{--bg:#f3f0e9;--card:#fff;--ink:#202633;--muted:#586174;--purple:#492365;--accent:#0b7469;--line:#dedee5;--soft:#eef6f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 system-ui,sans-serif}body.dark{--bg:#141820;--card:#202631;--ink:#f4f4f7;--muted:#bbc5d5;--purple:#c5a2eb;--accent:#71d9c5;--line:#414959;--soft:#263c3c}button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{padding:13px 3vw;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--card)}.brand{font-size:14px;letter-spacing:.08em;text-transform:uppercase}.controls{display:flex;gap:7px}.icon{width:44px;height:44px;padding:10px;display:grid;place-items:center}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}main{max-width:1150px;margin:25px auto;padding:0 25px 110px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.13em;font-size:14px;font-weight:800}h1{font-size:clamp(32px,4.5vw,56px);line-height:1.12;margin:10px 0 18px}h2{font-size:25px;margin:0 0 10px}p{margin:10px 0}.lead{font-size:23px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.card{padding:23px;background:var(--card);border:1px solid var(--line);border-radius:20px}.spanish{font-size:23px}.support{background:var(--soft);border-left:5px solid var(--accent)}.tag{font-size:14px;font-weight:700;color:var(--accent)}.step{padding:11px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.model{border-left:4px solid var(--purple);padding-left:18px;font-size:23px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chips span{border:1px solid var(--line);padding:5px 12px;border-radius:22px;font-size:17px}.timer{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;line-height:1.1}.timerbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:var(--card);border-radius:16px;border:1px solid var(--line);margin:20px 0}.timerbar button{font-size:16px;padding:7px 12px}.timerbar select{font-size:16px;max-width:270px}footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 3vw;display:flex;gap:12px;align-items:center;justify-content:space-between}.progress{height:4px;background:var(--line);position:absolute;top:0;left:0;right:0}.progress div{height:100%;background:var(--accent)}#jump{font-size:15px;max-width:48vw}.note{color:var(--muted);font-size:16px}details{margin:20px 0}summary{cursor:pointer;font-size:16px;color:var(--muted)}textarea{width:100%;min-height:220px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:15px;font:18px/1.5 system-ui}#toast{position:fixed;right:20px;top:80px;background:var(--ink);color:var(--card);padding:10px 20px;border-radius:10px;z-index:5}button:disabled{opacity:.4;cursor:default}@media(max-width:700px){.grid{grid-template-columns:1fr}body{font-size:17px}main{padding:0 16px 120px;margin-top:18px}.brand{max-width:130px}.card{padding:18px}.spanish,.model{font-size:21px}.timer{font-size:30px}.lead{font-size:20px}footer{gap:6px}footer button{padding:8px 11px}header{padding:10px 14px}.controls{gap:4px}}@media(prefers-reduced-motion:no-preference){main{animation:appear .2s ease}@keyframes appear{from{opacity:.6}to{opacity:1}}}</style></head><body><header><div class="brand">Dr. Rama <b>Spanish 3000</b></div><div class="controls"><button class="icon" id="theme" aria-label="Toggle dark mode" title="Dark mode"></button><button class="icon" id="sound" aria-label="Enable timer sound" title="Sound off"></button><button class="icon" id="full" aria-label="Toggle fullscreen" title="Fullscreen"></button></div></header><main id="main"></main><footer><div class="progress"><div id="progress"></div></div><button id="prev" aria-label="Previous activity">←</button><select id="jump" aria-label="Choose activity"></select><span id="count" class="note"></span><button id="next" aria-label="Next activity">→</button></footer><div id="toast" role="status" hidden></div><script>

const card=(title,content,cls='')=>`<section class="card ${cls}"><h2>${title}</h2>${content}</section>`;const prompts=arr=>arr.map(x=>`<div class="step spanish" lang="es">${x}</div>`).join('');const teacher=t=>`<details><summary>Facilitation notes</summary><div class="card">${t}</div></details>`;
const problems=[{title:'La entrada no funciona',a:'Asistente: Compraste una entrada, pero no funciona al escanearla. Explica qué pasó y pide ayuda.',b:'Empleado/a de taquilla: Comprueba el nombre, la fecha y el tipo de entrada. Ofrece una solución.',words:['la entrada','la taquilla','comprobar','la fecha'],starter:'Compré esta entrada ayer, pero…'},{title:'¿Dónde está mi amigo?',a:'Asistente: Perdiste a tu amigo entre la multitud. Describe cómo iba vestido y dónde estaban.',b:'Personal de seguridad: Haz preguntas y acuerda un lugar de encuentro.',words:['la multitud','la seguridad','el escenario','la pantalla gigante'],starter:'Estábamos cerca del escenario cuando…'},{title:'No veo el escenario',a:'Asistente A: No puedes ver el escenario. Quieres cambiar de lugar.',b:'Asistente B: Prefieres quedarte. Explica por qué y negocia una solución.',words:['el escenario','las gradas','la fila','la entrada general'],starter:'Desde aquí no se ve bien. ¿Nos movemos…?'},{title:'¡Demasiado volumen!',a:'Asistente: El volumen te molesta. Pide ayuda para poder disfrutar del concierto.',b:'Empleado/a: Explica dónde conseguir tapones para los oídos o dónde hay un lugar más tranquilo.',words:['el volumen','los tapones para los oídos','el recinto','el sonido'],starter:'El volumen está demasiado alto. ¿Dónde puedo…?'},{title:'La lluvia cambió los planes',a:'Asistente A: Empezó a llover durante el concierto al aire libre. Quieres irte.',b:'Asistente B: Quieres quedarte. Propón una solución que funcione para los dos.',words:['al aire libre','el público','el concierto','la salida'],starter:'Todo iba bien hasta que empezó a…'}];let problem=0;
const slides=[
{title:'Música y conciertos',minutes:0,html:()=>`<p class="eyebrow">Guía de actividades · 35–40 minutes</p><h1 lang="es">Del concierto<br>a la conversación.</h1><p class="lead">Build on the concert simulation and vocabulary from the class presentation.</p><div class="grid">${card('Today’s challenge',`<p lang="es" class="spanish">Participa. Resuelve un problema. Cuenta lo que pasó.</p><p>Use the handout as a resource. Communicate first; refine your Spanish as you go.</p>`)}${card('Our route',`<div class="step">01 · Musical memories — 5 min</div><div class="step">02 · Concert complications — 8 min</div><div class="step">03 · Video to story — 8 min</div><div class="step">04 · Post-concert interview — 9 min</div><div class="step">05 · Exit ticket — 5 min</div>`)}</div>${teacher('Begin after the group’s approximately 15-minute presentation and simulation. Invite the presenters to remain concert organizers and vocabulary resources. For a 40-minute extension, use the final debrief slide for five additional minutes. Timers start only when you press Start; each activity retains its own timer when you navigate.')}`},
{title:'La música de tu vida',minutes:5,phases:[['Think · 1 min',60],['Partner A · 2 min',120],['Partner B · 2 min',120]],html:()=>`<p class="eyebrow">01 · Connect · 5 minutes</p><h1 lang="es">La música de tu vida</h1><p class="lead">Think for one minute. Speak for two minutes each. Ask your partner a follow-up question.</p><div class="grid">${card('Choose a memory',prompts(['¿Qué música escuchabas cuando eras más joven?','¿Quién te presentó a un cantante o grupo que te gusta?','¿Recuerdas una ocasión especial relacionada con la música? ¿Qué pasó?']))}${card('Keep the conversation going',prompts(['¿Con quién estabas?','¿Dónde escuchaban esa música?','¿Qué pasó después?','¿Por qué fue importante para ti?']),'support')}</div><p class="model" lang="es">Cuando estaba en la secundaria, escuchaba música con mis amigos. Un día, uno de ellos me presentó a mi grupo favorito.</p><p class="note">No concert experience needed: talk about music at home, a celebration, a school performance, or another musical memory.</p>`},
{title:'Algo salió mal…',minutes:8,phases:[['Prepare · 1 min',60],['Round 1 · 2 min',120],['Retell · 1 min',60],['Switch + round 2 · 3 min',180],['Share · 1 min',60]],html:()=>`<p class="eyebrow">02 · Negotiate · 8 minutes</p><h1 lang="es">Algo salió mal…</h1><p class="lead">Stay in the concert world your classmates created. Take different roles, solve a problem, then switch roles with a new card.</p><div class="chips"><button id="draw">Shuffle problem</button><button id="cycle">Next problem →</button></div><div id="problem"></div>${teacher('Use one minute to prepare, two minutes for the first exchange, and one minute to retell the result. Switch roles and draw another problem for a three-minute second round. Reserve the final minute for a quick share. Presenters circulate as organizers and help classmates find expressions in the handout. No physical simulation of crowd movement is needed.')}`},
{title:'Del videoclip a la historia',minutes:8,phases:[['Watch · 2 min',120],['Discuss + replay · 3 min',180],['Build + share · 3 min',180]],html:()=>`<p class="eyebrow">03 · Observe · 8 minutes</p><h1 lang="es">Del videoclip a la historia</h1><p class="lead">Watch a 60–90-second excerpt selected by the presenting group. Observe the setting, people, and changes.</p><div class="grid">${card('Before and during viewing',prompts(['¿Dónde están las personas?','¿Qué hacen el cantante, los músicos o el público?','¿Qué cambia durante el video?']))}${card('Build a four-sentence account',prompts(['Al principio, había…','Mientras ___, …','Entonces…','Al final…']),'support')}</div><p><b>Watch → discuss → replay → tell.</b> Support your account with something visible or audible in the clip.</p><p class="note">Performance video without a plot? Describe the setting, what people were doing, and one change. Clearly identify any invented detail.</p>${teacher('Have the group open its selected video in its own presentation or tab. This guide does not supply a video. If the clip was already shown, replay only an excerpt. Invite the presenters to explain one choice they made when selecting it.')}`},
{title:'La entrevista',minutes:9,phases:[['Interview A · 3 min',180],['Interview B · 3 min',180],['Report · 3 min',180]],html:()=>`<p class="eyebrow">04 · Interview + retell · 9 minutes</p><h1 lang="es">Después del concierto</h1><p class="lead">One reporter, one concertgoer. Interview each other about today’s simulated concert, then report your partner’s experience.</p><div class="grid">${card('The reporter asks…',prompts(['¿Cómo era el recinto?','¿Qué hacía el público cuando empezó el concierto?','¿Qué ocurrió durante el espectáculo?','¿Cuál fue tu momento favorito? ¿Volverías?']))}${card('The concertgoer develops…',`<p lang="es" class="spanish">Describe el ambiente. Cuenta un acontecimiento. Explica tu reacción.</p><p>Use five expressions from the handout across your interview and report. You may add clearly fictional details.</p><div class="chips" lang="es"><span>la prueba de sonido</span><span>el público</span><span>el escenario</span><span>aplaudir</span><span>en directo</span></div>`,'support')}</div><p class="model" lang="es">Mi compañera estaba cerca del escenario cuando empezó el concierto. El público cantaba a coro. De repente, dejó de funcionar el micrófono, pero el cantante siguió cantando.</p><p class="note">Three minutes per interview, switching roles. Use the final three minutes to report to another pair or the class.</p>`},
{title:'Participación y práctica',minutes:5,html:()=>`<p class="eyebrow">05 · Reflect · 5 minutes · 10 points</p><h1 lang="es">Participación y práctica:<br>Música y conciertos</h1><p class="lead">Submit your response in the Canvas assignment. Use your own words and the class handout.</p><div class="grid">${card('Your exit ticket',`<div class="step"><b>1.</b> Write 4–6 sentences in Spanish about the simulation or role-play. Include background, an event, and <b>three expressions</b> from the handout.</div><div class="step"><b>2.</b> Write one question you asked a classmate.</div><div class="step"><b>3.</b> Identify one specific contribution from the presenting group that helped you participate or understand.</div>`)}${card('How you earn credit',`<div class="step"><b>4 points</b> · Active participation in partner and group tasks</div><div class="step"><b>3 points</b> · Meaningful use of three theme expressions</div><div class="step"><b>3 points</b> · Completed reflection with background and events</div><p class="note">Credit rewards engagement and meaningful attempts. You do not need perfect Spanish.</p>`,'support')}</div><details><summary>Optional drafting space</summary><p class="note">Temporary draft only. Nothing is sent or saved; copy your response before leaving.</p><textarea id="draft" aria-label="Temporary exit-ticket draft" placeholder="Mi experiencia…"></textarea><button id="copy">Copy draft</button></details>${teacher('This page does not submit to Canvas or record grades. Create the Canvas assignment separately. Base participation points on your observations as well as the reflection. Invite specific appreciation of the presenters’ work.')}`},
{title:'Cierre y conexiones',minutes:5,html:()=>`<p class="eyebrow">Optional extension · 5 minutes</p><h1 lang="es">¿Qué nos ayudó a comunicarnos?</h1><div class="grid">${card('The presenters notice…',`<p lang="es" class="spanish">Compartan dos expresiones que escucharon usar bien durante las actividades.</p><p>Name a specific example of successful communication.</p>`)}${card('The class reflects…',prompts(['¿Qué expresión nueva quieres volver a usar?','¿Qué estrategia te ayudó cuando te faltaba una palabra?']),'support')}</div><h2>Background + event</h2><p class="model" lang="es">El público <b>cantaba</b> cuando el cantante <b>bajó</b> del escenario.</p><p>The imperfect frames the ongoing scene; the preterite presents an event within it.</p>${teacher('Discuss two anonymous examples from today’s conversations. Ask what the speaker intended before suggesting a tense. Avoid treating mientras or cuando as automatic tense rules. Finish by thanking the group for creating the concert experience.')}`}
];let showVocab=false,showContrast=false;let index=0,muted=true,audioCtx,interval;const states=slides.map(s=>({remaining:s.minutes*60,running:false,end:0}));let draft='';
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}function chime(){if(muted)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[0,.23,.46].forEach((d,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=[660,830,990][i];g.gain.setValueAtTime(.0001,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+d+.03);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d+.2);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.22)})}catch{}}
function renderProblem(){let p=problems[problem];document.getElementById('problem').innerHTML=`<h2 lang="es" style="margin-top:24px">${p.title}</h2><div class="grid">${card('Role A',`<p lang="es" class="spanish">${p.a}</p>`)}${card('Role B',`<p lang="es" class="spanish">${p.b}</p>`)}</div><div class="chips" lang="es">${p.words.map(w=>`<span>${w}</span>`).join('')}</div><p class="model" lang="es">${p.starter}</p><p lang="es"><b>Después:</b> ¿Cuál era el problema y cómo lo resolvieron?</p>`}

const languageBanks=[
['el ritmo — rhythm · la melodía — melody · el estribillo — chorus','¿Qué instrumentos se oyen? Se oye la guitarra. El público canta a coro.'],
['escuchar — to listen · la canción — song · la letra — lyrics','Solía escuchar… / Mi canción favorita era… / Un día descubrí…'],
['la taquilla — ticket office · la multitud — crowd · las gradas — stands · los tapones para los oídos — earplugs','Compré esta entrada… / Estábamos cerca de… / ¿Podría ayudarme? / Al final resolvimos el problema.'],
['la batería — drums · el bajo — bass guitar · el estribillo — chorus · la estrofa — verse · el puente — bridge','Se oía… / El cantante estaba… / El público aplaudió cuando…'],
['el recinto — venue · la prueba de sonido — soundcheck · el público — audience · en directo — live','Había mucha gente. / Estábamos cerca del escenario. / Me encantó cuando… / Volvería porque…'],
['aplaudir — to applaud · el escenario — stage · la iluminación — lighting','Mientras ___, ___. / Al principio… / De repente… / Al final…'],
['el concierto — concert · la actuación — performance · cantar a coro — to sing together','Aprendí a decir… / Una expresión que quiero volver a usar es…']
];
const contrasts=[
['El público cantaba.','El público cantó el estribillo.','Cantaba places us inside an ongoing scene. Cantó presents the singing as a bounded event. Both can describe the same concert from different viewpoints.'],
['Escuchaba esa canción cuando iba a la escuela.','Escuché esa canción ayer.','The imperfect presents a repeated past experience. The preterite presents a particular listening event as a whole.','Cuando era adolescente, ___ (escuché / escuchaba) música todos los días. Un día, ___ (descubrí / descubría) un grupo nuevo.','escuchaba: repeated background; descubrí: the discovery as an event.'],
['Buscaba a mi amigo entre la multitud.','Encontré a mi amigo junto a la taquilla.','The search is presented as ongoing; finding the friend advances the story.','Mientras ___ (esperé / esperaba) en la fila, mi amigo me ___ (llamó / llamaba).','esperaba + llamó fits a call interrupting the ongoing wait. Llamaba would instead present calling as ongoing or repeated; the intended story determines the choice.'],
['El cantante bajaba del escenario.','El cantante bajó del escenario.','Bajaba shows the movement in progress. Bajó presents the descent as a complete event. Choose the viewpoint supported by the clip.','El público ___ (aplaudió / aplaudía) cuando el cantante ___ (apareció / aparecía).','aplaudía + apareció frames ongoing applause around an entrance. Aplaudió can instead present the audience’s reaction as a complete event. Explain your interpretation.'],
['La acústica era excelente.','El concierto fue excelente.','Era describes a feature of the setting; fue evaluates the concert as a completed experience.','___ (Hubo / Había) mucha gente cuando ___ (llegamos / llegábamos) al recinto.','Había + llegamos describes the crowd already there at the moment of arrival. Hubo presents attendance or an occurrence as a bounded whole in a different telling.'],
['Estábamos cerca del escenario.','Nos acercamos al escenario.','The imperfect locates us in the scene; the preterite presents our movement to a new position.','Write one background sentence and one event. Then combine them without changing your intended meaning.','Example: Estábamos cerca del escenario cuando empezó la última canción.'],
['El público cantaba cuando el cantante bajó.','El público cantó cuando el cantante bajó.','The first frames singing already in progress. The second can present singing as a bounded response. Cuando does not automatically determine a tense.']
];
function languagePanels(){const v=languageBanks[index],c=contrasts[index];return `<div class="chips" style="margin:20px 0"><button id="vocabToggle" aria-expanded="${showVocab}" aria-controls="vocabPanel">${showVocab?'Hide':'Show'} useful phrases / vocabulary</button><button id="contrastToggle" aria-expanded="${showContrast}" aria-controls="contrastPanel">${showContrast?'Hide':'Show'} preterite / imperfect</button></div><section id="vocabPanel" class="card support" ${showVocab?'':'hidden'}><h2>Useful language</h2><p lang="es" class="spanish">${v[0]}</p><p lang="es" class="model">${v[1]}</p></section><section id="contrastPanel" class="card" style="margin-top:18px" ${showContrast?'':'hidden'}><h2>Preterite / imperfect: choose your meaning</h2><div class="grid"><div><span class="tag">Imperfect · inside the scene</span><p lang="es" class="spanish">${c[0]}</p></div><div><span class="tag">Preterite · event as a whole</span><p lang="es" class="spanish">${c[1]}</p></div></div><p>${c[2]}</p>${c[3]?`<p class="spanish" lang="es">${c[3]}</p><details><summary>Show explanation / possible answer</summary><p>${c[4]}</p></details>`:''}</section>`}

function render(){const s=slides[index];document.getElementById('main').innerHTML=s.html().replace(/<p class="model"/g,'<p '+(showVocab?'':'hidden ' )+'class="model"')+languagePanels()+(s.minutes?`<div class="timerbar"><span class="timer" id="clock" role="timer" aria-label="Activity time remaining"></span><button id="start">Start</button><button id="reset" aria-label="Reset timer">↺ Reset</button><button id="add">+30s</button>${s.phases?`<select id="phase" aria-label="Set timer for a phase"><option value="">Set a phase…</option>${s.phases.map(([n,t])=>`<option value="${t}">${n}</option>`).join('')}</select>`:''}<span class="note" id="timerstatus"></span></div>`:'');document.getElementById('jump').value=index;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('count').textContent=`${index+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(index+1)/slides.length*100}%`;if(s.minutes){document.getElementById('start').onclick=()=>{let st=states[index];if(st.running){st.remaining=Math.max(0,Math.ceil((st.end-Date.now())/1000));st.running=false}else{if(st.remaining<=0)st.remaining=s.minutes*60;st.end=Date.now()+st.remaining*1000;st.running=true}tick()};document.getElementById('reset').onclick=()=>{states[index]={remaining:s.minutes*60,running:false,end:0};tick()};document.getElementById('add').onclick=()=>{let st=states[index];st.remaining+=30;if(st.running)st.end+=30000;tick()};if(s.phases)document.getElementById('phase').onchange=e=>{if(e.target.value){states[index]={remaining:Number(e.target.value),running:false,end:0};tick()}}}document.getElementById('vocabToggle').onclick=()=>{showVocab=!showVocab;render()};document.getElementById('contrastToggle').onclick=()=>{showContrast=!showContrast;render()};if(index===2){renderProblem();document.getElementById('draw').onclick=()=>{problem=(problem+1+Math.floor(Math.random()*(problems.length-1)))%problems.length;renderProblem()};document.getElementById('cycle').onclick=()=>{problem=(problem+1)%problems.length;renderProblem()}}if(index===5){document.getElementById('draft').value=draft;document.getElementById('draft').oninput=e=>draft=e.target.value;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(draft);notify('Draft copied. Paste it into Canvas.')}catch{document.getElementById('draft').select();notify('Select and copy the draft with your keyboard.')}}}tick()}
function tick(){states.forEach((st,i)=>{if(st.running){st.remaining=Math.max(0,Math.ceil((st.end-Date.now())/1000));if(!st.remaining){st.running=false;chime();notify(slides[i].title+' — time is up.')}}});const st=states[index],clock=document.getElementById('clock');if(clock){clock.textContent=String(Math.floor(st.remaining/60)).padStart(2,'0')+':'+String(st.remaining%60).padStart(2,'0');document.getElementById('start').textContent=st.running?'Pause':st.remaining===0?'Restart':'Start';document.getElementById('timerstatus').textContent=st.remaining===0?'Time is up':st.running?'Running':'Ready / paused'}}
function go(n){index=Math.max(0,Math.min(slides.length-1,n));render();window.scrollTo({top:0,behavior:'instant'})}document.getElementById('jump').innerHTML=slides.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join('');document.getElementById('jump').onchange=e=>go(Number(e.target.value));document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});const theme=document.getElementById('theme');theme.innerHTML=svg('moon');theme.onclick=()=>{document.body.classList.toggle('dark');theme.innerHTML=svg(document.body.classList.contains('dark')?'sun':'moon');theme.setAttribute('aria-pressed',String(document.body.classList.contains('dark')))};const sound=document.getElementById('sound');sound.innerHTML=svg('mute');sound.onclick=()=>{muted=!muted;sound.innerHTML=svg(muted?'mute':'volume');sound.title=muted?'Sound off':'Sound on';sound.setAttribute('aria-label',muted?'Enable timer sound':'Mute timer sound');sound.setAttribute('aria-pressed',String(!muted));if(!muted)chime()};document.getElementById('full').innerHTML=svg('full');document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Fullscreen is unavailable in this viewer. Open the HTML in a browser.')}};render();interval=setInterval(tick,250);
</script></body></html>
