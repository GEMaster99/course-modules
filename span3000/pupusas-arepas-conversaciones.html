<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A la mesa · Pupusas y arepas</title><style>
:root{--bg:#f6f2e9;--paper:#fffdf8;--ink:#28261f;--muted:#676359;--line:#dcd5c7;--accent:#66394a;--green:#365d49;--soft:#ece7da;--help:#f2e6d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}body.dark{--bg:#191d1b;--paper:#232925;--ink:#f3efe5;--muted:#c2c1b7;--line:#475149;--accent:#e4a8ba;--green:#a7d4b7;--soft:#303a33;--help:#3a342a}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:4px}button{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:9px 14px}button:hover{border-color:var(--accent)}header{max-width:1180px;margin:auto;padding:26px 28px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:750;color:var(--muted)}.brand{font:700 26px Georgia,serif}.tools{display:flex;gap:8px}.icon{width:42px;height:42px;padding:10px;display:grid;place-items:center}.icon svg{width:20px;height:20px}main{max-width:1180px;margin:auto;padding:0 28px 40px}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:15px 0}.intro p{margin:0;font-size:14px;color:var(--muted)}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 24px}nav button{text-align:left;display:flex;gap:12px;align-items:center;font-size:14px}nav button.active{background:var(--green);color:var(--bg);border-color:var(--green)}.num{font:22px Georgia,serif}h1{font:clamp(32px,4vw,49px)/1.1 Georgia,serif;margin:9px 0 15px;letter-spacing:-.025em}.scene{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;margin-bottom:22px}.context{max-width:710px;margin:0}.outcome{background:var(--soft);padding:18px 22px;border-radius:12px;font-size:15px}.outcome strong{color:var(--green);display:block;margin-bottom:5px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px}.role{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative}.role .letter{font:italic 40px Georgia,serif;color:var(--accent);float:right}h2{font:26px Georgia,serif;margin:7px 0 13px}.role p{margin:0}.role .eyebrow{color:var(--accent)}.vocab{margin:18px 0;color:var(--muted);font-size:14px}.vocab strong{color:var(--ink)}details{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-top:12px}summary{cursor:pointer;padding:15px 18px;font-weight:650;font-size:15px}.support{padding:0 18px 18px}.phrasegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.phrase{background:var(--help);padding:12px 15px;border-radius:8px;cursor:pointer}.phrase [lang=es]{font-weight:600;display:block}.gloss{font-size:14px;color:var(--muted);display:none;margin-top:4px}.phrase:hover .gloss,.phrase:focus-within .gloss,.phrase.open .gloss,.showgloss .gloss{display:block}.tip{font-size:13px;color:var(--muted);margin:0 0 12px}.phrase{width:100%;text-align:left;border:0}.grammar{padding:0 20px 18px}.grammar p{margin:6px 0}.grammar p[lang=es]{color:var(--green);font-weight:600}.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.twist{background:var(--help);padding:16px 20px;border-radius:10px;margin:0 0 16px}.next{background:var(--green);color:var(--bg);border-color:var(--green)}footer{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}.badge{font-size:12px;color:var(--accent);font-weight:700}.controls{display:flex;gap:8px;flex-wrap:wrap}.round{font-size:12px;color:var(--muted)}@media(max-width:720px){header,main{padding-left:18px;padding-right:18px}nav{grid-template-columns:1fr 1fr}.scene,.roles,.phrasegrid{grid-template-columns:1fr}.intro{align-items:flex-start}.role{padding:20px}footer{gap:10px}.tools{gap:5px}.intro p{max-width:230px}}
</style></head><body><header><div><div class="eyebrow">Spanish 3000 Proficiency Development</div><div class="brand">A la mesa</div></div><div class="tools"><button class="icon" id="gloss" title="Show or hide all English glosses" aria-label="Show all English glosses" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h12M9 3v3m-4 2c2 5 5 7 9 9M13 7c-1 4-4 8-9 10m10 4 4-11 4 11m-6-4h4"/></svg></button><button class="icon" id="dark" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14a8 8 0 0 1-10-10A8.5 8.5 0 1 0 20 14Z"/></svg></button><button class="icon" id="full" title="Fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></header><main><div class="intro"><p>Pairs · Keep your vocabulary sheet handy.<br>Respond, ask follow-up questions, and reach a decision.</p><span class="round" id="round"></span></div><nav aria-label="Conversation scenarios" id="nav"></nav><section id="content" aria-live="polite"></section><footer><span>Weber State University · Pupusas & arepas</span><span>Dr. Rama</span></footer></main><script>
const scenes=[{"title": "The unhappy customer", "spanish": "¡Esto no es lo que esperaba!", "tag": "Complaint & defense", "context": "A customer has tried the pupusas or arepas and is disappointed. The owner believes the food deserves a fair defense. Choose the dish together before starting.", "a": ["Customer", "Explain two specific problems with the flavor or texture. Ask for a solution. Listen to the owner and decide what would be fair."], "b": ["Owner", "Defend at least one characteristic of your dish and explain its preparation. Acknowledge a reasonable complaint. Negotiate a solution without dismissing the customer."], "finish": "Agree on a replacement, an adjustment, or a reason to keep the original dish.", "vocab": "soso/a · seco/a · salado/a · crujiente · suave · casero/a", "phrases": [["Esta arepa está un poco…", "This arepa is a little…"], ["Esperaba algo más…", "I was expecting something more…"], ["Entiendo su punto, pero nuestra receta es…", "I understand your point, but our recipe is…"], ["Está crujiente por fuera y suave por dentro.", "It is crispy outside and soft inside."], ["Podemos ofrecerle…", "We can offer you…"], ["Me parece bien si…", "That works for me if…"]], "twists": ["The customer likes the filling but dislikes the outside.", "There are no more ingredients for a replacement. Find another solution.", "The customer admits that this is their first time trying this dish."], "grammar": ["Nuestra receta es tradicional.", "Esta pupusa está demasiado seca.", "Traditional characterizes the recipe; dry describes the condition of this serving."]}, {"title": "Two stalls, one choice", "spanish": "¿Cuál vale la pena?", "tag": "Compare & persuade", "context": "At a food market, one person can buy only one dish. A vendor offers both arepas de queso and pupusas revueltas. Compare the options and make a convincing recommendation.", "a": ["Undecided customer", "Give two preferences about flavor or texture. Ask about both dishes. Challenge one recommendation and make your final choice."], "b": ["Vendor", "Ask what the customer likes. Describe the ingredients and preparation of both dishes. Compare them and recommend one based on the customer’s preferences."], "finish": "Choose one dish and explain the choice with two reasons.", "vocab": "más… que · menos… que · tan… como · sabroso/a · relleno/a · vale la pena", "phrases": [["¿De qué son las pupusas?", "What are the pupusas made of / filled with?"], ["¿Cuál me recomienda y por qué?", "Which do you recommend, and why?"], ["Si prefiere algo…, le recomiendo…", "If you prefer something…, I recommend…"], ["Esta está más… que aquella.", "This one is more… than that one."], ["Las dos son…, pero esta está…", "Both are…, but this one is…"], ["Prefiero… porque…", "I prefer… because…"]], "twists": ["The customer wants a mild flavor but a crispy texture.", "The vendor’s favorite dish is different from the customer’s preference.", "The customer wants to know whether the salsa is spicy. Do not assume that it is."], "grammar": ["Estas son arepas de queso.", "Esta arepa está más crujiente que aquella.", "Ser identifies the dish; estar evaluates the texture of the servings being compared."]}, {"title": "Rescue the recipe", "spanish": "¿Qué salió mal?", "tag": "Diagnose & advise", "context": "A new cook has prepared the class recipe, but something has gone wrong. An experienced cook helps diagnose the problem. Use the actual steps from your arepas or pupusas presentation.", "a": ["New cook", "Choose a problem: dry dough, a pupusa that opens, a bland filling, or a burnt outside with a raw center. Explain what you did. Answer questions and propose a change."], "b": ["Experienced cook", "Ask at least two questions about the preparation. Suggest a plausible cause and a concrete adjustment. Explain how you want the result to be."], "finish": "Agree on two changes for the next batch and predict the result.", "vocab": "amasar · dejar reposar · sellar los bordes · dorar por ambos lados · crudo/a · quemado/a", "phrases": [["La masa está demasiado…", "The dough is too…"], ["Primero…, después…", "First…, then…"], ["¿Cuánto tiempo la dejaste reposar?", "How long did you let it rest?"], ["¿Sellaste bien los bordes?", "Did you seal the edges well?"], ["Podrías… para que no quede tan…", "You could… so it does not turn out so…"], ["La próxima vez voy a…", "Next time I am going to…"]], "twists": ["The new cook skipped the resting step. Explain why the sequence matters.", "The outside is burnt, but the center is still raw. Discuss heat and cooking time.", "The dough cracks while shaping. Decide what small adjustment to try first."], "grammar": ["Esta es nuestra receta de arepas.", "La masa está seca; las arepas quedaron duras.", "Estar describes the dough’s condition. Quedar helps describe how the food turned out."]}, {"title": "Feed the celebration", "spanish": "Un menú para todos", "tag": "Negotiate & plan", "context": "An event organizer and a caterer must plan a small celebration. Decide between arepas, pupusas, or both. Discuss the filling, sides, texture, and how to serve the food.", "a": ["Event organizer", "Explain three priorities: for example, mild flavor, a vegetarian option, food served warm, or a limited budget. Question one proposal and negotiate the final menu."], "b": ["Caterer", "Propose a menu using today’s recipes. Explain what you can adjust and what needs planning. Ask about priorities and defend your recommendation."], "finish": "Agree on the dish or dishes, one filling or ingredient choice, and a serving plan.", "vocab": "suave · picante · fresco/a · tradicional · depende de · por una parte… por otra parte…", "phrases": [["Para la celebración necesitamos…", "For the celebration we need…"], ["¿Se pueden preparar sin…?", "Can they be prepared without…?"], ["Podemos preparar una versión de…", "We can prepare a version with…"], ["Depende de cuántas personas…", "It depends on how many people…"], ["Las vamos a servir…", "We are going to serve them…"], ["Lo mejor de esta opción es…", "The best thing about this option is…"]], "twists": ["Several guests do not eat meat. Adapt the filling rather than calling the original pupusas revueltas vegetarian.", "The food will travel for 30 minutes. Discuss how its temperature and texture may change.", "The organizer wants both dishes, but there is time to prepare only one."], "grammar": ["Las pupusas son un plato tradicional.", "Queremos que estén calientes al servirlas.", "Ser characterizes the dish. Estar describes the desired serving condition; queremos que introduces the subjunctive here."]}];let current=0,swapped=false,showAll=false;const $=x=>document.getElementById(x);
function render(){const s=scenes[current];$('nav').innerHTML=scenes.map((x,i)=>`<button class="${i===current?'active':''}" aria-current="${i===current?'step':'false'}" onclick="go(${i})"><span class="num">0${i+1}</span><span>${x.title}</span></button>`).join('');$('round').textContent=`Scenario ${current+1} of 4 · ${swapped?'Roles switched':'First round'}`;let roles=swapped?[s.b,s.a]:[s.a,s.b];$('content').innerHTML=`<div class="badge">${s.tag}</div><h1 lang="es">${s.spanish}</h1><div class="scene"><p class="context">${s.context}</p><div class="outcome"><strong>Your shared goal</strong>${s.finish}</div></div><div class="roles">${roles.map((r,i)=>`<article class="role"><span class="letter">${i?'B':'A'}</span><div class="eyebrow">Student ${i?'B':'A'}</div><h2>${r[0]}</h2><p>${r[1]}</p></article>`).join('')}</div><div class="vocab"><strong>Find these on your sheet:</strong> <span lang="es">${s.vocab}</span></div><details><summary>Spanish phrase help</summary><div class="support"><p class="tip">Use these as starting points. Hover, focus, or tap a phrase for its English gloss. Use the language icon to show all glosses.</p><div class="phrasegrid">${s.phrases.map(p=>`<button class="phrase" onclick="this.classList.toggle('open');this.setAttribute('aria-expanded',this.classList.contains('open'))" aria-expanded="false"><span lang="es">${p[0]}</span><span class="gloss">${p[1]}</span></button>`).join('')}</div></div></details><details><summary>Ser / estar: a quick reminder</summary><div class="grammar"><p lang="es">${s.grammar[0]}</p><p lang="es">${s.grammar[1]}</p><p>${s.grammar[2]}</p><p class="tip">Think characterization versus condition or experienced result. Permanent versus temporary is not a reliable rule.</p></div></details><div class="bottom"><div class="controls"><button onclick="twist()">Add a twist</button><button onclick="swap()">Switch roles</button></div><div class="controls"><button onclick="go((current+3)%4)" aria-label="Previous scenario">←</button><button class="next" onclick="go((current+1)%4)">Next scenario →</button></div></div><p id="twist" class="twist" hidden aria-live="polite"></p>`;}
function go(n){current=n;swapped=false;render()}function swap(){swapped=!swapped;render()}let lastTwist=-1;function twist(){let n;do{n=Math.floor(Math.random()*3)}while(n===lastTwist);lastTwist=n;$('twist').hidden=false;$('twist').textContent=scenes[current].twists[n]}
$('gloss').onclick=()=>{showAll=!showAll;document.body.classList.toggle('showgloss',showAll);$('gloss').setAttribute('aria-pressed',showAll);$('gloss').setAttribute('aria-label',showAll?'Hide all English glosses':'Show all English glosses')};$('dark').onclick=()=>document.body.classList.toggle('dark');$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('full').title='Fullscreen is unavailable in this browser; open the page in a full browser tab.'}};document.addEventListener('keydown',e=>{if(e.target.closest('button,summary,input,textarea,select'))return;if(e.key==='ArrowRight')go((current+1)%4);if(e.key==='ArrowLeft')go((current+3)%4)});render();
</script></body></html>
