<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Qué significa ser fan?</title>
<style>
:root{--bg:#101b29;--panel:#1a2b3f;--ink:#f7f5ee;--accent:#ffcc75;--muted:#bdd0df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid #668097;background:var(--panel);color:var(--ink);border-radius:9px;padding:10px 15px}button:hover,button:focus-visible{background:#334d68;outline:2px solid var(--accent)}header,footer{padding:14px 4%;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{border-bottom:1px solid #39516a}header strong{color:var(--accent);margin-right:auto}main{max-width:1350px;margin:auto;padding:25px 4%}h1{font-size:clamp(30px,4vw,54px);line-height:1.08;margin:12px 0 22px}h2{font-size:24px;color:var(--accent);margin-top:0}p,li{font-size:clamp(19px,2vw,26px);line-height:1.5}.tag{color:var(--accent);letter-spacing:1px;font-size:15px;font-weight:bold}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:25px}.panel{background:var(--panel);padding:24px;border-radius:16px;margin-bottom:18px}.phrase{padding:12px 0;border-bottom:1px solid #39516a;font-size:22px;line-height:1.45}.phrase:last-child{border:0}.en{display:none;color:var(--muted);font-size:17px;margin-top:5px}body.english .en{display:block}.prompt{font-size:clamp(23px,2.6vw,34px);color:var(--accent)}ul{padding-left:25px}blockquote{margin:0;font-size:clamp(21px,2.3vw,29px);line-height:1.55;border-left:4px solid var(--accent);padding-left:20px}.case{display:block;text-align:left;width:100%;margin:10px 0;padding:17px;font-size:22px}.case.active{border:2px solid var(--accent);background:#334d68}.detail{color:var(--accent);font-size:22px;line-height:1.5}footer{border-top:1px solid #39516a;justify-content:space-between}.progress{height:5px;background:#39516a}.progress span{display:block;height:100%;background:var(--accent)}#clock{font-size:26px;font-variant-numeric:tabular-nums;color:var(--accent)}select{background:var(--panel);color:white;padding:10px;border-radius:8px;max-width:100%}.small{font-size:16px;color:var(--muted)}textarea{width:100%;min-height:150px;padding:15px;background:#101b29;color:white;border:1px solid #668097;border-radius:10px;font:22px/1.5 Arial}label{display:block}@media(max-width:800px){.layout{grid-template-columns:1fr}header{gap:8px}.panel{padding:18px}}
</style></head><body>
<header><strong>AFICIÓN · IDENTIDAD · LEALTAD</strong><button id="translate" aria-pressed="false">Mostrar inglés</button><button id="fullscreen">Pantalla completa</button></header><div class="progress"><span id="bar"></span></div><main id="slide"></main>
<footer><div><button id="prev">← Anterior</button> <button id="next">Siguiente →</button></div><select id="jump" aria-label="Elegir diapositiva"></select><div><span id="clock" role="timer">03:00</span> <button id="start">Iniciar</button> <button id="reset">Reiniciar</button></div></footer>
<script>
const slides=[
{title:"¿De qué equipo eres?",stage:"ACTIVIDAD 1 · INTRODUCCIÓN · 3 MINUTOS",time:180,body:'<p class="prompt">¿Qué nos hace sentir parte de un equipo?</p><p>Piensa en el béisbol o en cualquier otro deporte. ¿Qué equipo sigues? ¿Por qué?</p><p>Si no sigues deportes, elige un artista, una serie o un videojuego.</p><details><summary>Ver un ejemplo</summary><p>«Soy de los Dodgers. En mi familia siempre hemos seguido a este equipo».</p></details>',vocab:[["ser de un equipo","to support / identify with a team"],["un aficionado / una aficionada de toda la vida","a lifelong fan"],["la afición","the fan base; enthusiasm for a sport or team"],["Soy de… / Soy fan de…","I support… / I’m a fan of…"],["Me siento parte de… porque…","I feel part of… because…"]]},
{title:"Mi historia como fan",stage:"ACTIVIDAD 1 · EN PAREJAS · 9 MINUTOS EN TOTAL",time:540,body:'<p class="prompt">¿Cómo empezó tu afición?</p><ul><li>¿Cuándo empezaste a seguir a tu equipo?</li><li>¿Quién influyó en ti?</li><li>¿Qué partido recuerdas y por qué?</li></ul><p>Persona A: cuenta tu historia. Persona B: escucha y haz preguntas de seguimiento. Después, cambien de papel.</p><p class="small">Aproximadamente 4 minutos por persona y 1 minuto para preparar lo que compartirán.</p>',vocab:[["empezar a seguir a un equipo","to start following a team"],["hacerse aficionado/a a…","to become a fan of…"],["Me hice fan cuando…","I became a fan when…"],["Mi padre / una amiga me transmitió su afición.","My father / a friend passed their enthusiasm on to me."],["Recuerdo un partido en el que…","I remember a game in which…"],["Desde entonces, sigo a…","Since then, I’ve followed…"]]},
{title:"Haz que la historia continúe",stage:"APOYO PARA LAS PAREJAS · DENTRO DE LOS MISMOS 9 MINUTOS",time:540,body:'<p class="prompt">Escucha un detalle y pregunta algo más.</p><p>«Mi abuelo me llevaba al estadio».</p><p>→ «¿Qué era lo que más te gustaba de ir con él?»</p><p>«Ganamos con un jonrón en la última entrada».</p><p>→ «¿Cómo reaccionaste cuando lo viste?»</p><p class="small">Esta diapositiva sirve de apoyo. Al avanzar aquí, el temporizador de las parejas continúa.</p>',vocab:[["¿Cómo te sentiste? / ¿Qué pasó después?","How did you feel? / What happened next?"],["¿Sigues apoyándolos? ¿Por qué?","Do you still support them? Why?"],["el estadio · las gradas","the stadium · the stands"],["un jonrón · una entrada","a home run · an inning"],["ganar / perder un partido","to win / lose a game"],["remontar · celebrar la victoria","to come from behind · celebrate the win"]]},
{title:"Lo que aprendí de mi compañero",stage:"ACTIVIDAD 1 · PUESTA EN COMÚN · 3 MINUTOS",time:180,body:'<p class="prompt">Comparte un detalle que te llamó la atención.</p><ul><li>¿A quién o a qué sigue tu compañero?</li><li>¿Cómo empezó su afición?</li><li>¿Qué recuerdo es importante para él o ella?</li></ul><p>Habla de tu compañero y explica por qué te interesó su historia.</p>',vocab:[["Mi compañero/a es aficionado/a a…","My partner is a fan of…"],["Empezó a seguir a… cuando…","They started following… when…"],["Me contó que…","They told me that…"],["Lo que más me llamó la atención fue…","What caught my attention most was…"],["Tenemos en común…","We have… in common."]]},
{title:"¿Por qué seguimos apoyando?",stage:"ACTIVIDAD 2 · LECTURA Y REACCIÓN · 3 MINUTOS",time:180,body:'<p class="small">Entrevista ficticia para practicar · Puedes sustituirla por el fragmento de tu entrevista.</p><blockquote>«Soy de este equipo desde pequeño. Mi abuelo me llevaba al estadio y me enseñó a llevar la cuenta de las carreras. Hemos pasado temporadas difíciles, pero no cambio de equipo cuando pierde. Para mí, el béisbol también es una manera de recordar a mi abuelo y sentirme parte de una comunidad».</blockquote><p class="prompt">Identifica una razón para apoyar al equipo. ¿Qué palabras del texto apoyan tu respuesta?</p>',vocab:[["apoyar a un equipo","to support a team"],["una temporada difícil","a difficult season"],["llevar la cuenta de las carreras","to keep track of the runs"],["los lazos familiares · la comunidad","family ties · community"],["Lo apoya porque…","They support it because…"],["Se ve en la frase…","We can see this in the phrase…"]]},
{title:"¿Quién es un fan fiel?",stage:"ACTIVIDAD 2 · EN GRUPOS · 9 MINUTOS EN TOTAL",time:540,body:'<p class="prompt">Seleccionen un caso y comparen sus opiniones.</p><button class="case" data-case="0">Alex solo ve las finales.</button><button class="case" data-case="1">Dani cambia de equipo cuando su equipo pierde.</button><button class="case" data-case="2">Sam apoya al mismo equipo durante años.</button><div id="caseDetail" class="detail">¿Qué sabemos de cada persona? ¿Qué necesitamos saber antes de juzgarla?</div><p>Comparen los tres casos y acuerden tres características de un fan fiel.</p>',vocab:[["un fan fiel · la lealtad","a loyal fan · loyalty"],["un aficionado ocasional","a casual fan"],["cambiar de equipo","to switch teams"],["subirse al carro del ganador","to jump on the winning team’s bandwagon"],["Para mí, ser fiel significa…","For me, being loyal means…"],["No necesariamente, porque…","Not necessarily, because…"]]},
{title:"Defiendan sus criterios",stage:"APOYO PARA LOS GRUPOS · DENTRO DE LOS MISMOS 9 MINUTOS",time:540,body:'<p class="prompt">¿La lealtad se demuestra de una sola manera?</p><ul><li>¿Hay que ver todos los partidos?</li><li>¿Se puede criticar al equipo y seguir siendo fiel?</li><li>¿Importa más cuánto sabes o cuánto te importa?</li><li>¿Cambiar de equipo siempre significa ser desleal?</li></ul><p>Usen un caso para explicar su opinión y respondan a una idea de otra persona.</p><p class="small">El temporizador del trabajo en grupos continúa.</p>',vocab:[["seguir al equipo en las buenas y en las malas","to follow the team through good times and bad"],["criticar · respetar · mantenerse fiel","to criticize · respect · remain loyal"],["Estoy de acuerdo en que…, pero…","I agree that…, but…"],["Entiendo tu punto; sin embargo…","I understand your point; however…"],["Por ejemplo, en el caso de…","For example, in the case of…"],["Depende de… / No hace falta…","It depends on… / You don’t have to…"]]},
{title:"Nuestra definición de un fan fiel",stage:"ACTIVIDAD 2 · PUESTA EN COMÚN · 3 MINUTOS",time:180,body:'<p class="prompt">Compartan tres características y expliquen una decisión.</p><label for="notes">Nuestro grupo considera que un fan fiel…</label><textarea id="notes" placeholder="1. …&#10;2. …&#10;3. …"></textarea><p>Elijan una característica y relaciónenla con uno de los tres casos.</p><p class="small">Estas notas se mantienen mientras la página siga abierta.</p>',vocab:[["Llegamos a la conclusión de que…","We reached the conclusion that…"],["Las tres características son…","The three characteristics are…"],["Elegimos… porque…","We chose… because…"],["Aunque…, sigue siendo…","Although…, they are still…"],["No todos estuvimos de acuerdo en…","We didn’t all agree about…"],["Nuestra decisión se basa en…","Our decision is based on…"]]}
];
let index=0,left=180,timer=null,notes="";
const el=id=>document.getElementById(id);
const cases=["¿Ver pocos partidos significa sentir menos pasión? ¿Y si Alex trabaja durante los partidos?","¿Por qué cambia Dani de equipo? ¿Busca victorias, nuevos jugadores o una conexión personal?","¿Apoyar durante muchos años basta para demostrar lealtad? ¿Cómo trata Sam a otros aficionados?"];
function clock(){el("clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
function pause(){clearInterval(timer);timer=null;el("start").textContent=left===0?"Terminado":"Iniciar"}
function render(keep=false){if(el("notes"))notes=el("notes").value;if(!keep){pause();left=slides[index].time;el("start").textContent="Iniciar"}const s=slides[index];el("slide").innerHTML='<div class="tag">'+s.stage+'</div><h1>'+s.title+'</h1><div class="layout"><section>'+s.body+'</section><aside class="panel"><h2>Vocabulario y expresiones</h2>'+s.vocab.map(x=>'<div class="phrase">'+x[0]+'<span class="en">'+x[1]+'</span></div>').join("")+'</aside></div>';if(el("notes"))el("notes").value=notes;el("jump").value=index;el("bar").style.width=((index+1)/slides.length*100)+"%";el("prev").disabled=index===0;el("next").disabled=index===slides.length-1;clock();document.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-case]").forEach(x=>x.classList.remove("active"));b.classList.add("active");el("caseDetail").textContent=cases[Number(b.dataset.case)]})}
function move(n){if(n<0||n>=slides.length)return;const keep=(index===1&&n===2)||(index===2&&n===1)||(index===5&&n===6)||(index===6&&n===5);index=n;render(keep)}
el("jump").innerHTML=slides.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s.title+'</option>').join("");
el("jump").onchange=e=>move(Number(e.target.value));el("prev").onclick=()=>move(index-1);el("next").onclick=()=>move(index+1);
el("translate").onclick=()=>{const on=document.body.classList.toggle("english");el("translate").textContent=on?"Ocultar inglés":"Mostrar inglés";el("translate").setAttribute("aria-pressed",on)};
el("start").onclick=()=>{if(timer){pause();return}if(left===0)return;el("start").textContent="Pausar";timer=setInterval(()=>{left=Math.max(0,left-1);clock();if(left===0)pause()},1000)};
el("reset").onclick=()=>{pause();left=slides[index].time;el("start").textContent="Iniciar";clock()};
el("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){el("fullscreen").textContent="Usa pantalla completa del navegador"}};
document.addEventListener("keydown",e=>{if(/TEXTAREA|INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==="ArrowRight")move(index+1);if(e.key==="ArrowLeft")move(index-1)});render();
</script></body></html>
