<script>

(function(){
 const root=document.getElementById('canvas-cd3adf152701');
 const preview=root.querySelector('#canvas-cd3adf152701-preview');
 const code=root.querySelector('#canvas-cd3adf152701-html');
 const source=root.querySelector('textarea');
 const frame=root.querySelector('iframe');
 const status=root.querySelector('[role="status"]');
 const controls=root.querySelectorAll('[data-action]');
 const raw=source.value;
 frame.srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><style>html,body{margin:0;padding:0;background:#ffffff!important;color:#2d2d2d;color-scheme:light;font-family:Arial,sans-serif}body{padding:16px}*{box-sizing:border-box}</style></head><body>'+raw+'</body></html>';
 function show(mode){
  preview.hidden=mode!=='preview';code.hidden=mode!=='html';
  controls.forEach(button=>{const action=button.dataset.action;if(action==='preview'||action==='html')button.setAttribute('aria-pressed',String(action===mode));});
  status.textContent=mode==='html'?'Copy this HTML into Canvas\'s HTML editor. The preview controls are not included.':'Preview is shown. Choose HTML to view and copy the Canvas source.';
 }
 async function copy(){
  try {if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(raw);status.textContent='Canvas HTML copied.';}
  catch(error){show('html');source.focus();source.select();let copied=false;try{copied=!!document.execCommand('copy');}catch(e){}status.textContent=copied?'Canvas HTML copied.':'HTML selected. Use your browser\'s Copy command, Ctrl+C, or Command+C.';}
 }
 function download(){
  const url=URL.createObjectURL(new Blob([raw],{type:'text/html;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='canvas-cd3adf152701-canvas.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Canvas HTML download started.';
 }
 controls.forEach(button=>button.addEventListener('click',()=>{const action=button.dataset.action;if(action==='preview'||action==='html')show(action);else if(action==='copy')copy();else if(action==='download')download();}));
})();

</script>
