<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convince Me · ENGL 1010</title>
<style>
:root{color-scheme:dark;--bg:#102923;--panel:#193b32;--ink:#fff9e9;--soft:#c9d9ce;--lime:#d4f58b;--line:#426054}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:13px 19px;background:transparent;color:var(--ink);font-weight:700;min-height:48px}button:hover{background:#305044}button:focus-visible{outline:3px solid var(--lime);outline-offset:4px}button.primary{background:var(--lime);color:var(--bg);border-color:var(--lime)}button:disabled{opacity:.45;cursor:default}.app{max-width:1600px;margin:auto;padding:clamp(20px,3vw,48px)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}h1{font-size:clamp(36px,5vw,68px);letter-spacing:-.055em;margin:8px 0 0}header p{margin:6px 0;color:var(--soft);font-size:20px}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.steps button{flex:1;min-width:140px;text-align:left;font-size:18px}.steps button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.stage{background:var(--panel);border-radius:24px;padding:clamp(24px,4vw,56px);min-height:390px;display:flex;flex-direction:column;justify-content:center}.tag{color:var(--lime);font-size:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.stage h2{font-size:clamp(32px,4.2vw,60px);line-height:1.12;letter-spacing:-.035em;margin:20px 0}.stage p{font-size:clamp(21px,2vw,28px);line-height:1.4;margin:10px 0;color:var(--soft)}.stage strong{color:var(--ink)}.timer{border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;justify-content:center}.clock{font-size:86px;font-weight:700;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:12px 0}.timer p{font-size:18px;color:var(--soft);min-height:42px;margin:14px 0}.track{height:8px;background:#426054;border-radius:8px;overflow:hidden;margin:8px 0 22px}.fill{height:100%;width:100%;background:var(--lime)}.timer-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.controls{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px}.controls>div{display:flex;gap:10px;flex-wrap:wrap}.foot{margin-top:24px;font-size:17px;color:var(--soft);line-height:1.5}.formula{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:12px}.formula div{border-top:3px solid var(--lime);padding-top:14px}.formula b{display:block;font-size:26px}.formula span{display:block;font-size:21px;line-height:1.35;margin-top:9px;color:var(--soft)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.done .clock{color:var(--lime)}@media(min-width:1500px){.layout{grid-template-columns:minmax(0,1fr) 360px}.clock{font-size:110px}}@media(max-width:850px){.layout{grid-template-columns:1fr}.timer{padding:20px}.clock{font-size:70px;margin:4px}.timer p{min-height:0}.stage{min-height:340px}header{align-items:flex-start}.formula{grid-template-columns:1fr}.formula div{padding-top:10px}.steps button{min-width:120px}.eyebrow{font-size:13px}}@media(max-width:480px){header{flex-wrap:wrap}.stage h2{font-size:34px}.steps{gap:6px}.steps button{font-size:16px;padding:12px}.controls button{flex:1}.controls>div{width:100%}}
</style>
</head>
<body>
<main class="app">
<header><div><div class="eyebrow">Dr. Rama</div><h1>Convince me.</h1><p>A small claim. A real audience. One minute.</p></div><button id="fullscreen">Full screen ↗</button></header>
<nav class="steps" aria-label="Activity stages"><button data-step="0">01 · Pair up</button><button data-step="1">02 · Partner A</button><button data-step="2">03 · Partner B</button><button data-step="3">04 · Debrief</button><button data-step="4">05 · Reveal</button></nav>
<div class="layout"><section class="stage" id="stage" aria-live="polite"></section><aside class="timer" aria-label="Round timer"><div class="tag" id="timer-label">Get ready</div><div class="clock" id="clock" role="timer" aria-label="Time remaining">1:00</div><div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div><div class="timer-buttons"><button class="primary" id="start">Start timer</button><button id="reset">Reset</button></div><p id="timer-note">Pair up, then move to Partner A.</p><div class="sr" id="announcement" role="status"></div></aside></div>
<div class="controls"><div id="prompt-controls"><button id="next-prompt">Next prompt →</button><button id="random-prompt">Shuffle prompt ⤨</button></div><div><button id="debrief">Debrief / reveal</button><button class="primary" id="advance">Start with Partner A →</button></div></div>
<div class="foot" id="foot">About 10–12 minutes total · No notes needed · Listen for how your partner tries to persuade you.</div>
</main>
<script>
(()=>{
'use strict';
const prompts=[
['The feed debate','TikTok is better than Instagram.'],['Pet people','Everyone who can responsibly care for a pet should have one.'],['Breakfast rules','Breakfast food is better at night.'],['Early birds?','College classes should never start before 10 a.m.'],['The pizza question','Pineapple belongs on pizza.'],['Digital declutter','You should delete one social-media app forever. Choose which one.'],['The AI debate','Students should be allowed to use AI on every assignment.'],['Weekend upgrade','Every weekend should be three days long.'],['Watch party','Watching a movie at home is better than going to a theater.'],['Campus life','Every college should have a nap room.'],['Playlist politics','Studying with music is better than studying in silence.'],['The best seat','The back row is the best place to sit in class.'],['Message received','Voice messages are better than text messages.'],['Small adventures','A road trip is better than a flight.'],['Snack time','Popcorn is the best movie snack.'],['Paper or pixels','Physical books are better than e-books.']];
const $=id=>document.getElementById(id);let step=0,index=Math.floor(Math.random()*prompts.length),remaining=60,total=60,running=false,deadline=0,interval=null;
const durations=[60,60,60,180,120];
function drawTime(){const seconds=Math.ceil(remaining);$('clock').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');$('fill').style.width=(remaining/total*100)+'%';$('start').textContent=running?'Pause':remaining===0?'Start again':remaining<total?'Resume':'Start timer';document.querySelector('.timer').classList.toggle('done',remaining===0)}
function pause(){if(running){remaining=Math.max(0,(deadline-Date.now())/1000)}running=false;clearInterval(interval);drawTime()}
function reset(){pause();remaining=total;drawTime();$('announcement').textContent='Timer reset.';setNote()}
function tick(){remaining=Math.max(0,(deadline-Date.now())/1000);if(remaining===0){running=false;clearInterval(interval);$('timer-note').textContent=step===1?'Time! Switch to Partner B.':step===2?'Time! Find a new partner to debrief.':'Time! Finish your thought.';$('announcement').textContent=$('timer-note').textContent}drawTime()}
function setNote(){$('timer-note').textContent=['Pair up, then move to Partner A.','B listens and may challenge.','A listens and may challenge.','New partner. Compare what worked.','Share a few examples with the class.'][step]}
function render(){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.step)===step));const [topic,prompt]=prompts[index];let html='';
if(step===0)html='<div class="tag">The setup · 2 minutes</div><h2>Find a partner.<br>Pick A and B.</h2><p>Try to win over <strong>this person</strong>. Use a story, an example, humor—whatever fits.</p><p><strong>17 students?</strong> Make 7 pairs + 1 trio. In the trio, A pitches to B and C; B and C split the second minute, 30 seconds each.</p>';
if(step===1||step===2)html='<div class="tag">'+(step===1?'Partner A':'Partner B')+' · '+topic+'</div><h2>'+prompt+'</h2><p><strong>Convince your partner in 60 seconds.</strong> Defend the claim or argue the opposite.</p><p>'+(step===1?'Listener: ask a question or push back. Notice what your partner does.':'Switch roles. Keep this claim or choose a new prompt. In the trio, B and C get 30 seconds each.')+'</p>';
if(step===3)html='<div class="tag">Debrief · 3 minutes</div><h2>What did your partner actually do to convince you?</h2><p>Find a <strong>new partner</strong> (one trio is fine). Describe a specific moment in everyday language.</p><p>Did they tell a story? Make you laugh? Give an example? Appeal to something you care about?</p><p><strong>What worked—or didn’t—and why for you?</strong></p>';
if(step===4)html='<div class="tag">The reveal · 2 minutes</div><h2>You just practiced<br>rhetorical analysis.</h2><div class="formula"><div><b>1. What?</b><span>What choice did the speaker make?</span></div><div><b>2. Why you?</b><span>Why use that choice for this audience?</span></div><div><b>3. What effect?</b><span>How did it influence you and serve the speaker’s purpose?</span></div></div><p>Move beyond “I agree” to <strong>how the argument works.</strong></p>';
$('stage').innerHTML=html;$('timer-label').textContent=['Get ready','Partner A · 60 sec','Partner B · 60 sec','New partner debrief','Class conversation'][step];$('start').disabled=step===0;$('reset').disabled=step===0;$('prompt-controls').hidden=!(step===1||step===2);$('prompt-controls').style.display=(step===1||step===2)?'flex':'none';$('advance').textContent=['Start with Partner A →','Switch to Partner B →','Find a new partner →','Reveal the connection →','Back to setup ↺'][step];$('debrief').textContent=step>=3?'Reveal / debrief':'Debrief / reveal';$('foot').textContent=step===4?'Try it: “They used ___ because their audience ___. This made ___, helping them ___.”':'About 10–12 minutes total · No notes needed · Listen for how your partner tries to persuade you.';setNote();drawTime()}
function go(n){pause();step=n;total=durations[n];remaining=total;render()}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.step))));$('advance').onclick=()=>go((step+1)%5);$('debrief').onclick=()=>go(step===3?4:3);$('next-prompt').onclick=()=>{index=(index+1)%prompts.length;render()};$('random-prompt').onclick=()=>{index=(index+1+Math.floor(Math.random()*(prompts.length-1)))%prompts.length;render()};$('reset').onclick=reset;
$('start').onclick=()=>{if(running){pause();return}if(remaining===0)remaining=total;deadline=Date.now()+remaining*1000;running=true;interval=setInterval(tick,100);drawTime()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('announcement').textContent='Full screen is unavailable here. Open this file in your browser.'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit full screen ↙':'Full screen ↗'});document.addEventListener('visibilitychange',()=>{if(running)tick()});render();
})();
</script>
</body>
</html>
