function go(i){if(i<0||i>=slides.length)return;index=i;revealed=false;modelShown=false;authorShown=false;partsShown=1;resetTimer();store('evidence-lesson-stage',String(index));try{history.replaceState(null,'','#stage-'+(index+1))}catch(e){}render();window.scrollTo({top:0,behavior:'instant'});$('stage-title').focus({preventScroll:true})}
