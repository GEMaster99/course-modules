<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La feria de trabajos · Módulo 4</title>
<style>
:root{--paper:#f4eee2;--ink:#1f1a14;--muted:#66584b;--rust:#b84a1f;--line:#d8cfbc;--purple:#492365}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--rust);outline-offset:4px}.shell{max-width:1220px;margin:auto;padding:24px 46px;min-height:100svh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font:12px monospace;letter-spacing:.12em;text-transform:uppercase}.brand b{display:inline-block;color:var(--purple);font:700 24px Georgia;margin-right:12px}.tools{display:flex;gap:10px}select,.quiet{background:transparent;border:1px solid var(--line);padding:10px;border-radius:5px;color:var(--ink)}main{flex:1;padding:36px 0 25px}.eyebrow{font:13px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin:0 0 16px}h1{font:clamp(34px,5vw,64px)/1.05 Georgia,serif;margin:0 0 24px;max-width:1000px}h1 em{color:var(--rust)}.lead{font-size:clamp(22px,2.4vw,30px);line-height:1.4;margin:0 0 24px;max-width:1000px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:22px 0}.tile{border-top:3px solid var(--rust);padding:20px;background:#fff9ef}.tile h2{font:28px Georgia;margin:0 0 12px}.tile p{font-size:21px;line-height:1.5;margin:5px 0}.emoji{font-size:48px;margin-bottom:12px}.talk{border-left:4px solid var(--purple);padding:8px 0 8px 22px;font-size:24px;line-height:1.45;margin:24px 0}.label{font:12px monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--purple);display:block;margin-bottom:9px}.reveal{background:#e7dfef;border-radius:8px;padding:22px 26px;margin:20px 0;font-size:24px;line-height:1.5}.reveal p{margin:5px 0}.reveal strong{color:var(--purple)}.hint{color:var(--muted);font-size:17px;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.chip{border:1px solid var(--line);border-radius:40px;padding:12px 20px;font-size:22px}table{width:100%;border-collapse:collapse;font-size:23px;margin:20px 0}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid var(--line)}th{font-size:16px;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:18px;display:flex;align-items:center;gap:20px;justify-content:space-between}.nav{display:flex;gap:12px}.nav button{border:1px solid var(--line);border-radius:6px;padding:14px 22px;background:transparent;color:var(--ink);min-width:120px}.nav #next{background:var(--purple);color:white;border-color:var(--purple)}button:disabled{opacity:.4;cursor:default}.progress{height:4px;background:var(--line);margin-top:20px}.progress span{display:block;height:100%;background:var(--rust);transition:width .15s}.count{font:13px monospace;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.listen-box{padding:18px 0}.voice-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}.voice-controls select{max-width:100%;min-width:220px}.skip-audio{margin-top:18px;border-top:1px solid var(--line);padding-top:8px}.listening-symbol{font-size:80px;display:block}.listen-box button{margin:8px 12px 8px 0;min-height:48px}.listen-box #audioStatus{display:block;margin-top:10px}@media(max-width:650px){.shell{padding:18px 20px}header{align-items:flex-start}.brand{max-width:130px}.tools{flex-wrap:wrap;justify-content:flex-end}select{max-width:150px}main{padding-top:25px}footer{flex-wrap:wrap}.nav{width:100%}.nav button{flex:1}table{font-size:17px}th,td{padding:12px 6px}.talk,.reveal{font-size:21px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header><div class="brand"><b>W</b>SPAN 2010 · Módulo 4</div><div class="tools"><select id="jump" aria-label="Elegir actividad"></select><button class="quiet" id="full" aria-label="Pantalla completa">⛶ Pantalla completa</button></div></header><main id="stage"></main><footer><div><span class="count" id="count"></span><div class="hint">← Atrás · → / espacio Avanzar · Mayús + espacio Atrás</div></div><div class="nav"><button id="prev">← Atrás</button><button id="next">Avanzar →</button></div></footer><div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="sr" id="announce" aria-live="polite"></div></div>
<script>
const tiles=(items)=>'<div class="grid">'+items.map(([icon,title,text])=>`<article class="tile"><div class="emoji" aria-hidden="true">${icon}</div><h2>${title}</h2><p>${text}</p></article>`).join('')+'</div>';
const talk=t=>`<div class="talk"><span class="label">En parejas · ¡Hablen!</span>${t}</div>`;
const chips=a=>'<div class="chips">'+a.map(x=>`<span class="chip">${x}</span>`).join('')+'</div>';
const slides=[
{section:'La misión',title:'Un trabajo. <em>Mil posibilidades.</em>',body:'<p class="lead">Bienvenidos a la feria de trabajos. Al final, van a recomendar un trabajo para una persona… ¡y elegir uno para ustedes!</p>'+chips(['🔎 Adivinar','⚖️ Comparar','🏆 Elegir'])+talk('¿Qué prefieres: trabajar con personas, con animales o con ideas? ¿Por qué?'),steps:['<span class="label">Un punto de partida</span>Prefiero trabajar con <strong>personas</strong> porque me gusta ayudar. ¿Y tú?']},
{section:'Las profesiones',title:'¿Quién soy?',body:tiles([['🐾','Pista 1','Trabajo con animales.'],['🩺','Pista 2','Examino a mis pacientes.'],['🐕','Pista 3','Mis pacientes no hablan.']])+talk('Adivinen la profesión. Expliquen una pista: «Creo que eres… porque…». ¿Qué otra profesión trabaja con animales?'),steps:['Soy <strong>veterinario / veterinaria</strong>. Cuido la salud de los animales.','<span class="label">Tu turno</span>Describe una profesión sin decir su nombre. Tu pareja hace una pregunta y adivina. Después, cambien de papel.']},
{section:'Las profesiones',title:'Tres personas. Tres trabajos.',body:tiles([['🍳','Lucía','Preparo comida en un restaurante.'],['🧯','Diego','Apago incendios y respondo a emergencias.'],['🎤','Alex','Canto frente a un público.']])+talk('¿A qué se dedica cada persona? ¿Cuál de estos trabajos te interesa más?'),steps:['Lucía es <strong>cocinera</strong>. Diego es <strong>bombero</strong>. Alex es <strong>cantante</strong>.','<span class="label">Observa y prueba</span>el cocinero / la cocinera · el bombero / la bombera · el cantante / la cantante<br>Ahora: el médico / la ___ · el actor / la ___','<strong>La médica · la actriz.</strong> Presenta a una persona real o imaginaria: «Se llama… Es… Su trabajo consiste en…».']},
{section:'Tus prioridades',title:'¿Qué hace que un trabajo sea <em>bueno?</em>',body:chips(['dinero','tiempo libre','creatividad','ayudar','seguridad','buenos compañeros'])+talk('Elige tus dos prioridades. Compáralas con las de tu pareja. ¿Tienen algo en común?'),steps:['Para mí, <strong>el tiempo libre</strong> es importante. También quiero <strong>ayudar a otras personas</strong>. ¿Qué es importante para ti?','<span class="label">Una decisión difícil</span>Mucho dinero + poco tiempo libre<br>o<br>Menos dinero + más tiempo libre<br><strong>¿Qué eliges y por qué?</strong>']},
{section:'Comparar cualidades',title:'¿Más creativo? ¿Menos peligroso?',body:tiles([['🎨','Diseñador/a','creativo · tranquilo'],['🧯','Bombero/a','peligroso · emocionante']])+'<p class="hint">Son ideas para debatir, no verdades sobre todas las personas.</p>'+talk('Compara los trabajos. Tu pareja puede estar de acuerdo o proponer otra opinión.'),steps:['El trabajo de bombero es <strong>más peligroso que</strong> el de diseñador.<br>El trabajo de diseñador es <strong>menos peligroso que</strong> el de bombero.','<span class="label">Construye otra comparación</span><strong>más / menos + adjetivo + que</strong><br>interesante · difícil · creativo · emocionante<br>«Para mí, … es … porque…».']},
{section:'Comparar experiencias',title:'Antes imaginaba… <em>Ahora pienso…</em>',body:'<p class="lead">De niño/a, ¿qué querías ser? ¿Qué piensas de ese trabajo ahora?</p>'+talk('Cuenta tu idea de antes. Compara ese trabajo con otro que te interesa ahora.'),steps:['De niña quería ser <strong>actriz</strong>. Ahora me interesa ser <strong>ingeniera</strong>. Para mí, la ingeniería es <strong>tan creativa como</strong> la actuación.','<span class="label">¿Qué significa tan… como?</span>Las dos cosas tienen el mismo nivel de una cualidad.<br><strong>tan + adjetivo + como</strong><br>Propón otra igualdad. ¿Tu pareja está de acuerdo?']},
{section:'La feria',title:'Conozcan a <em>Sol y Nico.</em>',body:tiles([['🍳','Sol · cocinera','30 horas por semana<br>4 días de trabajo<br>2 años de experiencia'],['🎨','Nico · diseñador','30 horas por semana<br>4 días de trabajo<br>5 años de experiencia']])+talk('¿Qué tienen en común? ¿Qué diferencia ven? Hagan una observación cada uno.'),steps:['Sol trabaja <strong>tantas horas como</strong> Nico.<br>Nico tiene <strong>más experiencia que</strong> Sol.','También: Sol trabaja <strong>tantos días como</strong> Nico.<br><strong>tanto/a/os/as + sustantivo + como</strong><br>¿Por qué «tantas horas» y «tantos días»?']},
{section:'La igualdad',title:'¿Tan o tanto? <em>Escuchen la diferencia.</em>',body:'<p class="lead">Sol es ___ creativa como Nico.<br>Sol tiene ___ experiencia como otra cocinera.<br>Sol trabaja ___ como Nico.</p>'+talk('Completen las tres ideas en voz alta. ¿Qué palabra viene después del espacio?'),steps:['Sol es <strong>tan</strong> creativa como Nico.<br>Sol tiene <strong>tanta</strong> experiencia como otra cocinera.<br>Sol trabaja <strong>tanto</strong> como Nico.','<span class="label">Tres caminos</span>tan + cualidad + como<br>tanto/a/os/as + cosa o cantidad + como<br>verbo + tanto como<br><strong>Compara tus estudios o tu trabajo con los de tu pareja.</strong>']},
{section:'La desigualdad',title:'La misma feria. <em>Nuevos datos.</em>',body:'<table><caption class="sr">Datos ficticios de los trabajos</caption><thead><tr><th>Persona</th><th>Proyectos por mes</th><th>Horas por semana</th><th>Reuniones por semana</th></tr></thead><tbody><tr><td>Sol</td><td>8</td><td>30</td><td>2</td></tr><tr><td>Nico</td><td>5</td><td>30</td><td>6</td></tr></tbody></table>'+talk('Hagan tres comparaciones distintas. Usen proyectos, reuniones y trabajar.'),steps:['Sol tiene <strong>más proyectos que</strong> Nico.<br>Sol tiene <strong>menos reuniones que</strong> Nico.<br>Sol trabaja <strong>tanto como</strong> Nico.','<span class="label">Cambia un dato</span>Imagina que Nico trabaja 40 horas. ¿Cómo cambia tu comparación?<br>«Nico trabaja <strong>más que</strong> Sol».']},
{section:'Cantidades',title:'¿Que o de? <em>El número importa.</em>',body:'<p class="lead">Nico tiene más experiencia ___ Sol.<br>Nico tiene más ___ tres años de experiencia.</p>'+talk('Completen las dos frases. Expliquen la diferencia con los datos: Sol = 2 años; Nico = 5 años.'),steps:['Nico tiene más experiencia <strong>que</strong> Sol.<br>Nico tiene más <strong>de</strong> tres años de experiencia.','<span class="label">Habla de ti</span>Cuando expresas una cantidad superior o inferior a un número: <strong>más / menos de</strong>.<br>«Estudio más de… horas por semana».<br>Después compara: «Estudio más / menos que…».']},
{section:'Comparaciones especiales',title:'¿Mejor para <em>quién?</em>',body:tiles([['☀️','Trabajo A','Buen horario para estudiar.<br>Poco tiempo para viajar.'],['✈️','Trabajo B','Muchos viajes.<br>Horario irregular.']])+talk('¿Qué trabajo es mejor para un estudiante? ¿Y para alguien que quiere viajar? Defiendan sus respuestas.'),steps:['Para un estudiante, el horario de A es <strong>mejor que</strong> el de B.<br>Para mí, un horario irregular es <strong>peor que</strong> uno fijo.','<strong>bueno → mejor · malo → peor</strong><br>Ahora imagina: Sol tiene 24 años y Nico tiene 28.<br>¿Quién es mayor? ¿Quién es menor?','Nico es <strong>mayor que</strong> Sol. Sol es <strong>menor que</strong> Nico.<br>Comparen a dos personajes o familiares.']},
{section:'Tres ofertas',title:'Llegó una tercera oferta.',body:tiles([['🍳','Cocina','30 horas/semana<br>4 días/semana<br>1.800 fichas/mes'],['🎨','Diseño','30 horas/semana<br>4 días/semana<br>2.000 fichas/mes'],['🐾','Clínica veterinaria','35 horas/semana<br>5 días/semana<br>2.200 fichas/mes']])+'<p class="hint">Ofertas inventadas. Las fichas son una moneda del juego.</p>'+talk('¿Dónde se gana más? ¿Dónde se trabaja menos? ¿Cuál elegirías?'),steps:['En la clínica se gana <strong>más que</strong> en los otros dos trabajos.<br>En cocina y diseño se trabaja <strong>menos que</strong> en la clínica.','<span class="label">De dos a todo el grupo</span>La clínica tiene <strong>el salario más alto de los tres trabajos</strong>.<br>Cocina tiene <strong>el salario más bajo de los tres</strong>.']},
{section:'Superlativos',title:'Los premios de la feria 🏆',body:chips(['el más creativo','el menos estresante','el más emocionante','el mejor para mí'])+talk('Da dos premios a las ofertas. Tu pareja debe pedir una razón: «¿Por qué?». Pueden tener ganadores diferentes.'),steps:['Para mí, diseño es <strong>el trabajo más creativo de los tres</strong> porque permite crear cosas nuevas.','<span class="label">Tu premio, tu criterio</span><strong>el / la + más / menos + adjetivo + de…</strong><br>«La clínica es <strong>la mejor opción para mí</strong> porque…».<br>¿Hay un trabajo que sea el mejor para todo el mundo?']},
{section:'Las relaciones',title:'Dos entrevistas. <em>¿Qué cambia?</em>',body:tiles([['A','Entrevista A','— Hola. ¿Cómo estás?<br>— Bien, gracias. ¿Y usted?<br>— Muy bien. Cuéntame sobre ti.'],['B','Entrevista B','— Buenos días. Empecemos.<br>— Buenos días.<br>— ¿Qué experiencia tienes?']])+talk('¿Cuál conversación te hace sentir más cómodo/a? ¿Qué valoras al conocer a un nuevo compañero?'),steps:['En algunos contextos laborales, crear <strong>confianza</strong> y mantener relaciones personales es especialmente importante. A esta atención a las relaciones se le llama <strong>personalismo</strong>.','<span class="label">Prueben una conversación</span>Saluden, hagan una pregunta para conocerse y después hablen del trabajo.<br>Las preferencias varían según la persona, la organización y el contexto. ¿Qué ayuda a crear confianza para ustedes?']},
{section:'La recomendación',title:'Un trabajo para <em>Mar.</em>',body:'<p class="lead">Mar estudia por las tardes. Le gusta crear cosas, quiere tiempo libre y no necesita el salario más alto.</p>'+tiles([['🍳','Cocina','Turno: 16:00–22:00<br>30 horas · 1.800 fichas'],['🎨','Diseño','Turno: 08:00–14:00<br>30 horas · 2.000 fichas'],['🐾','Clínica','Turno: 09:00–16:00<br>35 horas · 2.200 fichas']])+talk('Recomienden una oferta. Incluyan una igualdad, una diferencia y un superlativo.'),steps:['Diseño es <strong>la mejor opción para Mar</strong>. Se trabaja <strong>tanto como</strong> en cocina, pero se gana <strong>más que</strong> en cocina. Además, el horario permite estudiar por las tardes.','<span class="label">Nuevo giro</span>Mar dice: «Ahora quiero trabajar con animales y puedo cambiar mi horario de clases».<br>¿Cambian su recomendación? Expliquen qué criterio pesa más.']},
{section:'Tu oferta',title:'Inventen el trabajo <em>imposible.</em>',body:tiles([['🚀','Ideas','Paseador/a de dragones<br>Catador/a de chocolate lunar<br>Diseñador/a de sueños']])+talk('Inventen una profesión, dos tareas, un horario y un salario en fichas. Preparen un anuncio de 30 segundos.'),steps:['<span class="label">Un anuncio posible</span>Buscamos un <strong>paseador de dragones</strong>. Pasea dragones y limpia sus alas. Trabaja 20 horas por semana. Gana 3.000 fichas al mes. Es <strong>más emocionante que</strong> un trabajo de oficina.','<span class="label">Tu anuncio debe incluir</span>Una comparación con otro trabajo + un superlativo.<br>«Es tan… como…» · «Tiene más… que…» · «Es el trabajo más… de…».']},
{section:'La negociación',title:'Convence a <em>tu pareja.</em>',body:'<p class="lead">Presenta tu trabajo imposible. Tu pareja compara tu oferta con una de la feria y hace dos preguntas. Después, cambien de papel.</p>'+talk('¿Cuántas horas se trabaja?<br>¿Qué es lo más difícil?<br>¿Por qué es mejor para mí?'),steps:['<span class="label">No basta con decir «es mejor»</span>«Es mejor para ti <strong>porque…</strong>».<br>«Se trabaja menos que…».<br>«Tiene tantas vacaciones como…».<br>«Es la opción más… de…».','<span class="label">La decisión</span>¿Aceptas la oferta? Di una ventaja y una desventaja antes de decidir.']},
{section:'Tu elección',title:'¿Cuándo te gusta <em>tu trabajo?</em>',body:talk('Completa tres ideas con información real o imaginaria:<br><br>1. Para mí, un buen trabajo es…<br>2. Prefiero… porque es más / menos / tan…<br>3. La mejor opción para mí es… porque…')+'<p class="lead">Escucha a tu pareja. Cuenta a la clase algo que aprendiste sobre sus prioridades.</p>',steps:['<span class="label">Una última pregunta</span>¿Tu idea del mejor trabajo cambió durante la feria? ¿Qué comparación te ayudó a decidir?']}
];
const audioPeople=[{"name": "Luisa", "text": "Hola, soy Luisa. Trabajo en una clínica. Mis pacientes tienen patas, pelo y, a veces, una cola. Examino a los animales y ayudo a sus dueños. ¿A qué me dedico?", "answer": "Luisa es veterinaria.", "question": "¿Qué dos pistas escuchaste? ¿Te gustaría trabajar con animales?"}, {"name": "Jorge", "text": "Hola, soy Jorge. Trabajo en una escuela. Preparo clases, explico ideas y respondo a muchas preguntas. Mis estudiantes aprenden conmigo todos los días. ¿A qué me dedico?", "answer": "Jorge es maestro.", "question": "¿Qué hace Jorge? ¿Qué cualidad necesita una persona que hace este trabajo?"}, {"name": "Álvaro", "text": "Hola, soy Álvaro. Cuando una persona llama por una emergencia, salgo con mi equipo. Llevo un casco y ropa especial. Apago incendios y ayudo a las personas que están en peligro. ¿A qué me dedico?", "answer": "Álvaro es bombero.", "question": "¿Qué palabras te ayudaron? ¿Es más peligroso que el trabajo de maestro?"}, {"name": "Dalia", "text": "Hola, soy Dalia. Trabajo en un restaurante. Antes de abrir, corto verduras y preparo los ingredientes. Después preparo platos para los clientes. Me gusta inventar recetas nuevas. ¿A qué me dedico?", "answer": "Dalia es cocinera.", "question": "¿Qué tareas escuchaste? ¿Es tan creativo como el trabajo de diseñador?"}];
const listeningSlides=audioPeople.map((p,i)=>({section:'Adivina por la voz',title:`¿A qué se dedica <em>${p.name}?</em>`,audio:p.text,person:i,body:'<p class="lead">Escucha. Adivina la profesión. Explica qué pista te ayudó.</p><div class="listen-box"><span class="listening-symbol" aria-hidden="true">🎧</span><p class="hint">Primero, solo la voz. Puedes escuchar más de una vez.</p><div class="voice-controls"><label for="voiceChoice">Voz en español</label><select id="voiceChoice" aria-label="Voz en español"></select><button class="quiet" id="previewVoice">Probar voz</button></div><button class="quiet" id="replay">▶ Escuchar otra vez</button><button class="quiet" id="stopAudio">■ Detener</button><span id="audioStatus" class="hint" role="status"></span><div class="skip-audio"><button class="quiet" id="skipOne">Saltar esta actividad →</button><button class="quiet" id="skipAll">Continuar sin audio →</button></div></div>',steps:['<span class="label">Tu hipótesis</span>Creo que es… porque escuché…',`<span class="label">La profesión</span><strong>${p.answer}</strong>`, `<span class="label">Escucha y comprueba</span>${p.text}`+talk(p.question)]}));
slides.splice(1,1,...listeningSlides);
const synth=window.speechSynthesis;
let voices=[],activeAudio=null,voiceChoices={};
try{voiceChoices=JSON.parse(localStorage.getItem('m4-warmup-voices-v1'))||{}}catch{}
const preferredNames=[['Luisa','Paulina','Monica','Mónica','Dalia','Elena'],['Jorge','Alonso','Juan','Diego'],['Alvaro','Álvaro','Andres','Andrés','Carlos'],['Dalia','Elvira','Salome','Salomé','Monica','Mónica']];
function key(v){return v.voiceURI||v.name+'|'+v.lang}
function chosenVoice(person){const saved=voices.find(v=>key(v)===voiceChoices[person]);if(saved)return saved;const remote=voices.filter(v=>!v.localService),pool=remote.length?remote:voices;return pool.find(v=>preferredNames[person].some(n=>v.name.toLowerCase().includes(n.toLowerCase())))||pool[0]}
function status(message){const el=document.getElementById('audioStatus');if(el)el.textContent=message}
function stopAudio(){activeAudio=null;if(synth)synth.cancel()}
function playText(text){stopAudio();if(!synth){status('Este navegador no ofrece lectura de voz. Puedes saltar esta actividad.');return}const s=slides[index],voice=chosenVoice(s.person);if(!voice){status('Esperando las voces de Chrome. Prueba otra vez o continúa sin audio.');loadVoices();return}const utterance=new SpeechSynthesisUtterance(text);utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=0.9;activeAudio=utterance;utterance.onstart=()=>{if(activeAudio===utterance)status('Escuchando…')};utterance.onend=()=>{if(activeAudio===utterance){activeAudio=null;status('Puedes escuchar otra vez o avanzar.')}};utterance.onerror=e=>{if(activeAudio===utterance){activeAudio=null;status(e.error==='canceled'||e.error==='interrupted'?'Audio detenido.':'No se pudo reproducir. Prueba otra voz o continúa sin audio.')}};synth.speak(utterance)}
function playClue(){if(slides[index].audio)playText(slides[index].audio)}
function loadVoices(){voices=synth?synth.getVoices().filter(v=>/^es(?:-|_)/i.test(v.lang)).sort((a,b)=>Number(a.localService)-Number(b.localService)||a.name.localeCompare(b.name)):[];const select=document.getElementById('voiceChoice');if(!select)return;select.replaceChildren();if(!voices.length){select.add(new Option('Sin voces en español disponibles',''));select.disabled=true;status('Esperando voces en español. Puedes continuar sin audio.');return}select.disabled=false;voices.forEach(v=>select.add(new Option(v.name+' · '+v.lang+(v.localService?' · local':' · en línea'),key(v))));const selected=chosenVoice(slides[index].person);select.value=key(selected);if(!activeAudio)status(voices.some(v=>!v.localService)?'Las voces en línea necesitan conexión a internet.':'Chrome ofrece voces locales en este equipo. Prueba la voz antes de escuchar.');select.onchange=()=>{stopAudio();voiceChoices[slides[index].person]=select.value;try{localStorage.setItem('m4-warmup-voices-v1',JSON.stringify(voiceChoices))}catch{}status('Voz elegida. Pulsa «Probar voz» o escucha la pista.')}}
if(synth)synth.addEventListener('voiceschanged',loadVoices);
function skipAudio(all){stopAudio();index=all?5:Math.min(index+1,slides.length-1);step=0;render();window.scrollTo(0,0)}
let index=0,step=0;
const stage=document.getElementById('stage'),jump=document.getElementById('jump');
jump.innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.section}</option>`).join('');
function render(){const s=slides[index];stage.innerHTML=`<p class="eyebrow">${s.section}</p><h1>${s.title}</h1>${s.body}`+s.steps.slice(0,step).map(t=>`<div class="reveal">${t}</div>`).join('');jump.value=index;document.getElementById('count').textContent=`${index+1} / ${slides.length} · ${step===0?'Pregunta':`Paso ${step} de ${s.steps.length}`}`;document.getElementById('prev').disabled=index===0&&step===0;document.getElementById('next').disabled=index===slides.length-1&&step===s.steps.length;document.getElementById('next').textContent=s.audio&&step===0?'Escuchar →':step<s.steps.length?'Revelar →':'Siguiente →';document.getElementById('bar').style.width=((index+(step+1)/(s.steps.length+1))/slides.length*100)+'%';document.getElementById('announce').textContent=`Actividad ${index+1}: ${s.section}. ${step===0?'Pregunta':`Revelación ${step}`}`;const replay=document.getElementById('replay');if(replay)replay.onclick=playClue;const stop=document.getElementById('stopAudio');if(stop)stop.onclick=()=>{stopAudio();status('Audio detenido.')};if(s.audio){loadVoices();document.getElementById('previewVoice').onclick=()=>playText('Hola. Vamos a escuchar una pista y adivinar una profesión. ¿Están listos?');document.getElementById('skipOne').onclick=()=>skipAudio(false);document.getElementById('skipAll').onclick=()=>skipAudio(true);}}
function advance(){stopAudio();const startListening=Boolean(slides[index].audio)&&step===0;if(step<slides[index].steps.length)step++;else if(index<slides.length-1){index++;step=0;window.scrollTo(0,0)}render();if(startListening)playClue()}
function reverse(){stopAudio();if(step>0)step--;else if(index>0){index--;step=slides[index].steps.length;window.scrollTo(0,0)}render()}
document.getElementById('next').onclick=advance;document.getElementById('prev').onclick=reverse;jump.onchange=()=>{stopAudio();index=Number(jump.value);step=0;render();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(e.target.matches('select,input,textarea')||e.target.isContentEditable)return;if(e.code==='Space'||e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();e.shiftKey&&e.code==='Space'?reverse():advance()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();reverse()}});
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};
document.addEventListener('fullscreenchange',()=>{document.getElementById('full').textContent=document.fullscreenElement?'⛶ Salir de pantalla completa':'⛶ Pantalla completa'});render();
</script></body></html>
