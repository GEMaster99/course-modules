<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanish 2010 — Course Modules</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 60px 20px;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #9aa0aa;
    margin-top: 0;
    margin-bottom: 40px;
    max-width: 480px;
    line-height: 1.5;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: #4f7cff;
    transform: translateY(-2px);
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 1.15rem;
  }
  .card p {
    margin: 0;
    color: #9aa0aa;
    font-size: 0.9rem;
  }
  a.back {
    margin-top: 40px;
    color: #4f7cff;
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>Spanish 2010</h1>
  <p class="subtitle">Intermediate Spanish. Interactive modules for this course.</p>
  <div class="grid">
    <a class="card" href="modulo-1/">
      <h2>Módulo 1</h2>
      <p>¿Adónde fuiste de vacaciones? — el pretérito irregular, maneras de decir "to become", y vocabulario de viajes.</p>
    </a>
  </div>
  <a class="back" href="../">&larr; Back to all courses</a>
</body>
</html>
